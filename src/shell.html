<title>Eddy</title>
<style>

:root{
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --ink:#3a2818; --ink-dim:#6f5840; --ink-faint:#9b886a;
  --accent:#9a4a28; --river:#9a7a48; --river-deep:#6e5330; --teal:#3f7d73;
  --rapid:#3a6f92; --card:#f5eede; --line:rgba(74,42,18,.28); --mark:#4a3422;
  --nav-h:58px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font); color:var(--ink); background:#f4f1ea;}
body::before{content:""; position:fixed; inset:0; z-index:-2; background:#f4f1ea;}


/* ---- Grand Canyon rock-art background motifs ---- */
#bgmotif{position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:0; mix-blend-mode:multiply;
  background-repeat:repeat; background-position:center 20px; background-size:216px 216px;
  transition:opacity .5s ease;}

header{position:fixed; top:0; left:0; right:0; z-index:20;
  background:rgba(241,232,213,.94); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); padding:8px 14px; padding-top:max(8px, env(safe-area-inset-top));}
.htop{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
.htitle{font-family:var(--font); font-size:15px; line-height:1; color:var(--ink);}
.hreach{font-family:var(--font); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--teal); text-align:right; white-space:nowrap;}
.hreach #hmile{display:block; color:var(--ink); font-size:13px; font-weight:600;}

.keys{display:flex; flex-direction:column; align-items:flex-start; gap:4px; margin-top:8px;}
.kgrp{display:flex; align-items:center; gap:5px;}
.klabel{font-family:var(--font); font-size:9px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim); width:58px; flex:none; text-align:right;}
.knote{font-family:var(--font); font-size:8.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint);}
.kbar{height:9px; border-radius:2px; border:1px solid var(--line);}
.kqual{width:50px; background:linear-gradient(to right,#cbbf9a,#82a455,#33653a);}
.krapid{width:24px; background:var(--rapid);}
.khike{width:34px; background:linear-gradient(to right,#dcb096,#b26840,#74301a);}
.chips{display:flex; gap:3px;}
.chip{width:22px; height:22px; border-radius:5px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font); font-size:11px; font-weight:500; border:1px solid var(--line);
  user-select:none; -webkit-tap-highlight-color:transparent; box-shadow:inset 0 -2px 0 rgba(0,0,0,.13);}
.chip.off{opacity:.26; filter:grayscale(.75);}
.chip.sm{width:20px; height:20px; font-size:10.5px;}

/* consolidated filter button + sheet */
.fbar{display:flex; align-items:center; gap:8px; margin-top:8px;}
.fbtn{display:inline-flex; align-items:center; gap:7px; font-family:var(--font); font-size:10px;
  font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim);
  background:#f5eede; border:1px solid var(--line); border-radius:8px; padding:6px 11px;
  -webkit-tap-highlight-color:transparent; cursor:pointer;}
.fbtn.on{background:#efdcc9; border-color:var(--accent); color:var(--accent);}
.fbtn .fico{font-size:12px; line-height:1;}
.fcount{display:none; min-width:16px; height:16px; padding:0 4px; border-radius:9px; background:var(--accent);
  color:#f3e6cf; font-size:9.5px; font-weight:600; letter-spacing:0; align-items:center; justify-content:center;}
.fbtn.on .fcount{display:inline-flex;}
.fsum{font-family:var(--font); font-size:9px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-faint); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

.fsheetWrap{position:fixed; inset:0; z-index:60; background:rgba(40,24,12,.55); backdrop-filter:blur(3px);
  display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .22s ease;}
.fsheetWrap.show{opacity:1; pointer-events:auto;}
.fsheet{width:100%; max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch; background:var(--card);
  border-top-left-radius:18px; border-top-right-radius:18px; border-top:1px solid var(--line);
  box-shadow:0 -12px 34px rgba(40,20,10,.4); transform:translateY(12%); transition:transform .24s cubic-bezier(.4,0,.2,1);
  padding:0 16px max(16px,env(safe-area-inset-bottom));}
.fsheetWrap.show .fsheet{transform:translateY(0);}
.fshead{position:sticky; top:0; z-index:2; background:var(--card); padding:14px 0 8px;
  display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line);}
.fstitle{font-family:var(--font); font-size:17px; color:var(--ink);}
.fsclose{font-family:var(--font); font-size:24px; line-height:1; color:var(--ink-faint);
  -webkit-tap-highlight-color:transparent; cursor:pointer; padding:0 4px;}
.fsec{padding:11px 0 12px; border-bottom:1px solid var(--line);}
.fsec:last-of-type{border-bottom:none;}
.fseckicker{display:flex; align-items:center; gap:8px;
  font-family:var(--font); font-size:9px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink); margin-bottom:8px;}
.fgrp{display:flex; align-items:center; gap:9px; margin-top:8px;}
.fgrp:first-of-type{margin-top:0;}
.fgname{font-family:var(--font); font-size:9px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-faint); width:62px; flex:none; text-align:right; line-height:1.2;}
.fgchips{display:flex; gap:4px; flex-wrap:wrap;}
.fsecbtns{display:flex; gap:6px; margin-left:auto;}
.fseclink{font-family:var(--font); font-size:9px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--teal); background:#efe6d2; border:1px solid var(--line);
  border-radius:999px; padding:4px 10px; line-height:1;
  -webkit-tap-highlight-color:transparent; cursor:pointer;}
.fseclink.hide{color:#95331a; background:#f3ddd6; border-color:#d9b6a8;}
.fsfoot{display:flex; gap:9px; padding:13px 0 4px; position:sticky; bottom:0; background:var(--card);}
.fsfoot .tsbtn{flex:1; text-align:center;}
.fshint{font-family:var(--font); font-size:9.5px; letter-spacing:.05em; color:var(--ink-faint);
  line-height:1.5; padding-bottom:4px;}
.btn{font-family:var(--font); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-dim); background:#f5eede; border:1px solid var(--line); border-radius:6px;
  padding:5px 9px; -webkit-tap-highlight-color:transparent;}
.btn.on{background:#e6dbc6; color:var(--ink);}

#view-map{position:relative;}
#view-map::before{display:none}
#view-map>.plot{position:relative; z-index:1;}
.chart{position:relative; width:100%; max-width:640px; margin:0 auto;}
.cluster{position:absolute; z-index:2; background:color-mix(in srgb,var(--teal) 10%,transparent);
  border-top:1.5px dashed color-mix(in srgb,var(--teal) 55%,transparent);
  border-bottom:1.5px dashed color-mix(in srgb,var(--teal) 55%,transparent);}
.clusterLabel{position:absolute; z-index:8; font-family:var(--font); font-size:9px; font-weight:600;
  letter-spacing:.05em; text-transform:uppercase; color:#2f5a53; background:color-mix(in srgb,var(--teal) 15%,#f5eede);
  padding:1px 6px; border-radius:8px; border:1px solid color-mix(in srgb,var(--teal) 45%,transparent); white-space:nowrap; pointer-events:none;
  transform-origin:center center; transform:translate(50%,-50%) rotate(90deg);}
.gband{position:absolute; z-index:2; cursor:pointer;
  border-top:1.5px dashed transparent; border-bottom:1.5px dashed transparent;}
.gband.sel{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 38%,transparent);}
.gbandLabel{position:absolute; z-index:7; font-family:var(--font); font-size:9px; font-weight:600;
  letter-spacing:.04em; text-transform:uppercase; color:#5a3212; background:color-mix(in srgb,#c9b48f 55%,#f5eede);
  padding:1px 5px; border-radius:8px; border:1px solid color-mix(in srgb,#9a6a3a 42%,transparent); white-space:nowrap; pointer-events:none;
  transform-origin:center center; transform:translate(-50%,-50%) rotate(-90deg);}

.mline{position:absolute; left:0; right:0; height:1px; background:rgba(74,42,18,.09); z-index:1;}
.river{position:absolute; z-index:7; pointer-events:none; border-radius:3px;
  background:linear-gradient(90deg,var(--river-deep),var(--river) 45%,var(--river-deep)); box-shadow:0 0 0 1px rgba(60,40,20,.10);}
.flow{position:absolute; z-index:8; pointer-events:none; width:0; height:0; transform:translate(-50%,0);
  border-left:5px solid transparent; border-right:5px solid transparent;
  border-bottom:7px solid rgba(247,240,222,.7); filter:drop-shadow(0 -1px 0 rgba(40,60,60,.25));}
.bar{position:absolute; display:flex; align-items:center; z-index:6; -webkit-tap-highlight-color:transparent;}
.stick{height:4px; width:100%; filter:drop-shadow(0 1px 0 rgba(70,40,20,.22));}
.bar.rapid .stick{border-radius:3px;}
.bar.camp{justify-content:flex-end;}
.bar.camp.bleft .stick{border-radius:3px 0 0 3px;}
.bar.camp.bright .stick{border-radius:0 3px 3px 0;}
.bar.sel .stick{box-shadow:0 0 0 1.4px rgba(58,30,15,.85);}
.hike{position:absolute; z-index:9; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent;}
.hike .hdash{height:4px; width:100%; border-radius:2px;
  box-shadow:0 0 0 .75px rgba(52,26,12,.55), 0 1px 0 rgba(70,40,20,.22);}
.hike.sel .hdash{box-shadow:0 0 0 2px rgba(52,26,12,.95), 0 1px 0 rgba(70,40,20,.22);}
.lm{position:absolute; z-index:10; display:flex; align-items:center; -webkit-tap-highlight-color:transparent;}
.lm .ld{width:11px;height:11px;flex:none;background:var(--mark);transform:rotate(45deg);border:1px solid #2c1b0f;}
.lm .lpill{margin-left:8px; font-family:var(--font); font-weight:500; font-size:10px; letter-spacing:.03em;
  color:var(--ink); line-height:1.12; background:rgba(245,238,222,.92); padding:2px 7px; border-radius:8px; border:1px solid var(--line);}
.lm.sel .ld{box-shadow:0 0 0 2px #2c1b0f;}

.sheet{position:fixed; left:0; right:0; bottom:var(--nav-h); z-index:40; transform:translateY(130%);
  transition:transform .26s cubic-bezier(.4,0,.2,1); background:var(--card);
  border-top-left-radius:16px; border-top-right-radius:16px; border-top:1px solid var(--line);
  box-shadow:0 -10px 30px rgba(60,40,20,.28); padding:14px 18px; padding-bottom:18px; max-height:62vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.sheet.show{transform:translateY(0);}
.sheet .grab{width:38px; height:4px; border-radius:3px; background:rgba(74,42,18,.25); margin:0 auto 11px;}
.sheet .iname{font-family:var(--font); font-size:18px; line-height:1.08; color:var(--ink); margin-bottom:6px; padding-right:30px;}
.sheet .imeta{font-family:var(--font); font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--accent); margin-bottom:9px; display:flex; gap:13px; flex-wrap:wrap;}
.sheet .imeta b{color:var(--ink);}
.sheet .idesc{font-size:14px; line-height:1.55; color:var(--ink-dim);}
.sheet .hdiff{font-family:var(--font); font-size:12px; letter-spacing:.02em;
  color:var(--ink); margin-bottom:7px;}
.sheet .ifoot{margin-top:13px; padding-top:10px; border-top:1px solid var(--line);
  font-size:11px; line-height:1.5; color:var(--ink-faint);}
.sheet .ifoot:empty{display:none;}
.stars{letter-spacing:.08em; font-size:12px;}
.sheet .close{position:absolute; top:12px; right:16px; font-family:var(--font); font-size:22px; line-height:1; color:var(--ink-faint); -webkit-tap-highlight-color:transparent;}
.qdot{display:inline-block; width:9px; height:9px; border-radius:2px; vertical-align:middle; margin-right:4px;}
.foot{text-align:center; font-family:var(--font); font-size:9px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-faint); padding:14px 10px 26px;}
.calc{position:fixed; inset:0; z-index:60; background:rgba(40,24,12,.55); backdrop-filter:blur(3px);
  display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .22s ease;}
.calc.show{opacity:1; pointer-events:auto;}
.abbtn{flex:1; text-align:left; background:#f5eede; border:1.5px solid var(--line); border-radius:10px;
  padding:8px 11px; -webkit-tap-highlight-color:transparent;}
.abbtn.active{border-color:var(--accent); background:#efdcc9;}
.spin{width:72px; font-family:var(--font); font-size:16px; color:var(--ink); background:#fffaf0;
  border:1.5px solid var(--line); border-radius:8px; padding:7px 9px; -webkit-appearance:none; appearance:none;}
.result{margin-top:12px; background:linear-gradient(180deg,#fbf4e4,#f1e6cd); border:1px solid var(--line);
  border-radius:12px; padding:13px 15px; text-align:center;}
.search{margin-top:12px; width:100%; font-family:var(--font); font-size:14px; color:var(--ink);
  background:#fffaf0; border:1.5px solid var(--line); border-radius:9px; padding:9px 12px; -webkit-appearance:none; appearance:none;}
.poi{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid rgba(74,42,18,.10); -webkit-tap-highlight-color:transparent;}
.poi .pname{flex:1; font-family:var(--font); font-size:14px; color:var(--ink); line-height:1.18;}

/* =========================================================
   TAB SHELL  (new)
   ========================================================= */
.plot{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));}

/* views */
.view{display:none;}
.view.active{display:block;}
.page.active{display:flex;}

/* page header for non-map tabs */
.pageHeader{position:fixed; top:0; left:0; right:0; z-index:20;
  background:rgba(241,232,213,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:13px 14px; padding-top:max(13px, env(safe-area-inset-top));
  align-items:center; justify-content:center;}
.pageHeader .hback{position:absolute; left:10px; bottom:11px; font-family:var(--font); font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); background:none; border:0; padding:2px 4px; -webkit-tap-highlight-color:transparent;}
.pageHeader .phtitle{max-width:62%; text-align:center; font-family:var(--font); font-size:17px; color:var(--ink); line-height:1;}

/* generic placeholder page */
.page{min-height:100vh; text-align:center; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:calc(60px + env(safe-area-inset-top)) 24px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);}
.page .soon{font-family:var(--font); font-size:9px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-faint); border:1px solid var(--line); border-radius:20px; padding:4px 13px;}
.page h2{font-family:var(--font); font-size:23px; color:var(--ink); line-height:1.08;}
.page p{font-family:var(--font); font-size:14.5px; line-height:1.6; color:var(--ink-dim); max-width:33ch;}

/* bottom tab bar */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex;
  background:rgba(236,223,197,.97); backdrop-filter:blur(10px);
  border-top:1px solid var(--line); box-shadow:0 -4px 14px rgba(60,40,20,.10);
  padding-bottom:env(safe-area-inset-bottom);}
.tabbtn{flex:1; min-width:0; overflow:hidden; background:transparent; border:0; cursor:pointer;
  padding:7px 2px 6px; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--ink-faint); -webkit-tap-highlight-color:transparent;}
.tabbtn svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
.tabbtn .tlabel{font-family:var(--font); font-size:8.5px; font-weight:500; letter-spacing:.03em;
  text-transform:uppercase; line-height:1; white-space:nowrap;}
.tabbtn.on{color:var(--accent);}
.tabbtn.on .tlabel{color:var(--ink); font-weight:600;}
.tabbtn:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; border-radius:8px;}

/* =========================================================
   COMPENDIUM checklist
   ========================================================= */
.cx{max-width:640px; margin:0 auto;
  padding:calc(var(--page-h,52px) + 12px) 12px calc(var(--nav-h) + env(safe-area-inset-bottom) + 22px);}
@keyframes cxpop{from{opacity:0; transform:scale(.7);} to{opacity:1; transform:scale(1);}}


/* =========================================================
   SAFETY tab
   ========================================================= */
.sf{max-width:640px; margin:0 auto;
  padding:calc(var(--page-h,52px) + 12px) 12px calc(var(--nav-h) + env(safe-area-inset-bottom) + 22px);}

#itBody{background:#f5eede; border:1px solid var(--line); border-radius:14px; padding:2px 14px 12px; margin-top:6px;}


/* =========================================================
   HISTORY tab
   ========================================================= */
.hi{max-width:640px; margin:0 auto;
  padding:calc(var(--page-h,52px) + 12px) 12px calc(var(--nav-h) + env(safe-area-inset-bottom) + 22px);}
.tsbtn{padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:#efe6d2; color:var(--accent);
  font-family:var(--font); font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  cursor:pointer; -webkit-tap-highlight-color:transparent;}
.tsbtn.solid{background:var(--accent); color:#fff; border-color:#5a1c10;}
.tsbtn.warn{background:#f3ddd6; border-color:#d9b6a8; color:#95331a;}

</style>
<style>
/* app chrome, in the original's visual language */
.shell { min-height: 100vh; }
.shell main { padding-top: calc(52px + env(safe-area-inset-top)); padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); }
.shell.onmap main { padding-top: 0; }

.rg { color: var(--ink); font-family:var(--font); }
.rg *, .rg *::before, .rg *::after { box-sizing: border-box; }
.rg button { font-family: inherit; cursor: pointer; }

.rg .pad { padding: 16px 15px 28px; }
.rg .row { display: flex; gap: 8px; align-items: flex-end; }
.rg .mt { margin-top: 15px; }
.rg .mt-s { margin-top: 8px; }
.rg .mb { margin-bottom: 18px; }
.rg .mb-s { margin-bottom: 6px; }

.rg h1 { font-family:var(--font); font-size: 21px; line-height: 1.1; color: var(--ink); margin: 0 0 14px; font-weight: 400; }
.rg .serif { font-family:var(--font); font-size: 19px; line-height: 1.12; color: var(--ink); }
.rg .label { display: block; font-family:var(--font); font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); margin-bottom: 8px; }
.rg .line { font-size: 14px; line-height: 1.55; color: var(--ink-dim); }
.rg .pre { white-space: pre-wrap; }
.rg .muted { font-family:var(--font); font-size: 9.5px; letter-spacing: .05em; color: var(--ink-faint); line-height: 1.5; }
.rg .mile { font-family:var(--font); font-size: 10px; letter-spacing: .06em; color: var(--ink-faint); min-width: 42px; display: inline-block; }
.rg .struck { text-decoration: line-through; color: var(--ink-faint); }

/* sub-tab pills — the original's .hsubbtn */
.rg .tabs { display: flex; gap: 7px; padding: 11px 15px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.rg .tabs::-webkit-scrollbar { display: none; }
.rg .tab { flex: 0 0 auto; font-family:var(--font); font-size: 10.5px; font-weight: 600; letter-spacing: .04em; line-height: 1.2; text-transform: uppercase; color: var(--ink-dim); background: #f5eede; border: 1px solid var(--line); border-radius: 20px; padding: 8px 13px; }
.rg .tab.on { background: var(--accent); border-color: var(--accent); color: #f6ecd8; }

.rg .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.rg .chip { display: inline-flex; position: static; box-shadow: none; pointer-events: auto; width: auto; height: auto; align-items: center; padding: 7px 12px; border-radius: 20px; border: 1px solid var(--line); background: #f5eede; font-family:var(--font); font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-dim); }
.rg .chip.on { background: var(--accent); border-color: var(--accent); color: #f6ecd8; }
.rg .chip.on.river { background: var(--teal); border-color: var(--teal); }

.rg .field { display: block; flex: 1; margin-bottom: 10px; }
.rg .field input, .rg .field textarea { width: 100%; font-family:var(--font); font-size: 14px; color: var(--ink); background: #fbf6e8; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
.rg .field textarea { min-height: 70px; resize: vertical; }
.rg .field.narrow { max-width: 112px; }
.rg input:focus-visible, .rg textarea:focus-visible, .rg button:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }

.rg .btn { font-family:var(--font); font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #f6ecd8; background: var(--accent); border: 1px solid var(--accent); border-radius: 7px; padding: 9px 14px; }
.rg .btn.ghost { background: #f5eede; color: var(--ink-dim); border-color: var(--line); }
.rg .btn.danger { background: #f3ddd6; color: #95331a; border-color: #d9b6a8; }
.rg .btn:disabled { opacity: .38; cursor: default; }
