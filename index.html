 The bedrock is Paleozoic marine limestone \u2014 old tropical seafloor \u2014 but the reach is defined by something startlingly young: black basalt from volcanoes on the north rim that erupted directly into the already-carved canyon within roughly the last million years, much of it within the last few hundred thousand. Molten lava poured over the rim and repeatedly dammed the Colorado, backing up lakes that then failed catastrophically; Lava Falls (Mile 179) sits amid that debris. When these eruptions lit the canyon, Ice Age Arizona was cooler and greener, roamed by mammoths, ground sloths, and other megafauna. (Approximate reach.)"},{s:217,e:260,n:"Vishnu \xB7 Lower Gorge",full:"Vishnu Basement Rocks \u2014 Lower Granite Gorge",era:"Paleoproterozoic",age:"~1.7 billion years ago",c:"#3a3540",d:"Below Diamond Creek the river enters its last dark inner canyon, the Lower Granite Gorge, cutting once more into 1.7-billion-year-old Vishnu schist and granite. As in the gorges upstream, this is the deeply buried, metamorphosed root of an ancient mountain range \u2014 from a time when the seas held only single-celled life and the continents were bare. (Approximate reach.)"},{s:260,e:280.5,n:"Grand Wash",full:"Grand Wash Cliffs reach",era:"Paleozoic",age:"faulted ~15 million years ago",c:"#b3a585",d:"Approaching Pearce Ferry the strata rise and the walls step back down through Paleozoic marine limestones and sandstones \u2014 the same ancient tropical-sea rocks, here lifted along the Grand Wash Fault. That fault is the sharp western edge of the Colorado Plateau, where it drops into the stretched, faulted Basin and Range that began pulling apart around 15 million years ago; the Grand Wash Cliffs mark the very end of the Grand Canyon. Today the moving river gives way here to the still water of Lake Mead, a reservoir less than a century old."}],guide:[{name:"Amphibians",subs:[{name:"True Toads",items:[{n:"Red-spotted Toad",d:"Small gray toad flecked with orange-red warts; its long, high, musical trill fills the canyon on warm nights after rain."},{n:"Woodhouse's Toad",d:"A large toad with a pale mid-back stripe; gives a nasal, sheep-like 'waaah' from river backwaters and pools."},{n:"Arizona Toad",d:"A soft-spoken toad of clear rocky streams and springs, now scarce where it hybridizes with Woodhouse's Toad."}],sci:"Bufonidae"},{name:"Spadefoots",items:[{n:"Great Basin Spadefoot",d:"Named for the black 'spade' on each hind foot used to dig backward into soil; emerges explosively to breed in rain pools."}],sci:"Scaphiopodidae"},{name:"Treefrogs",items:[{n:"Canyon Treefrog",d:"A warty, rock-colored treefrog that basks on boulders by day; its loud, resonant call echoes off canyon walls at dusk."}],sci:"Hylidae"},{name:"True Frogs",items:[{n:"Lowland Leopard Frog",d:"A green, spotted native frog of desert springs and streams, much reduced by drying and invasive bullfrogs."},{n:"American Bullfrog",inv:1,d:"The largest North American frog and an aggressive invader that eats native frogs, fish, and hatchling turtles wherever it spreads."}],sci:"Ranidae"},{name:"Salamanders",items:[{n:"Barred Tiger Salamander",d:"A stout, blotched salamander that spends most of its life underground, appearing at pools and tanks only to breed."}],sci:"Ambystomatidae"}]},{name:"Birds",subs:[{name:"Ducks & Geese",items:[{n:"Canada Goose",d:"Familiar honking goose; pairs and family groups graze sandbars and loaf on quiet river eddies."},{n:"Gadwall",d:"A subtly handsome gray dabbling duck; the drake shows a black stern and a chestnut wing patch in flight."},{n:"American Wigeon",d:"A whistling dabbler; the drake's white crown earned it the old name 'baldpate.'"},{n:"Mallard",d:"The classic green-headed duck, ancestor of most domestic ducks; dabbles in shallows and backwaters."},{n:"Cinnamon Teal",d:"A small duck; the breeding drake is a striking rich cinnamon-red with a ruby eye."},{n:"Northern Pintail",d:"An elegant, long-necked dabbler; the drake's namesake needle-thin tail points skyward."},{n:"Green-winged Teal",d:"North America's smallest dabbling duck, fast and agile, twisting in tight flocks over the water."},{n:"Redhead",d:"A diving duck with a round rufous head and gray body; winters on open river reaches."},{n:"Bufflehead",d:"A tiny, bold black-and-white diver; the drake wears a big white 'bonnet' and nests in old flicker holes."},{n:"Common Goldeneye",d:"A compact diver with a bright golden eye and round white cheek spot; its wings whistle in flight."},{n:"Common Merganser",d:"A large, sleek, fish-eating duck with a saw-edged bill; cruises the current and dives for fish."}],sci:"Anatidae"},{name:"New World Quail",items:[{n:"Gambel's Quail",d:"A plump desert quail with a teardrop head plume; coveys scurry through brush giving a bright 'chi-ca-go-go' call."}],sci:"Odontophoridae"},{name:"Pheasants & Allies",items:[{n:"Chukar",inv:1,d:"A stocky partridge of rocky slopes introduced from Eurasia, with barred flanks and a bold black necklace; prized by hunters, hard to catch."},{n:"Wild Turkey",d:"Large native game bird of the rim forests; the local Merriam's form has pale tail tips and occasionally wanders lower."}],sci:"Phasianidae"},{name:"Grebes",items:[{n:"Pied-billed Grebe",d:"A small brown diving bird that sinks quietly out of sight; its ringed bill and pumping call give it away."},{n:"Western Grebe",d:"An elegant black-and-white diver with a swan-like neck, famed for its dancing courtship 'rush' across the water."}],sci:"Podicipedidae"},{name:"Pigeons & Doves",items:[{n:"Rock Pigeon",inv:1,d:"The city pigeon, introduced from Europe; nests on cliff ledges just as its wild ancestors did."},{n:"Eurasian Collared-Dove",inv:1,d:"A pale dove with a black neck-ring; a rapid Old World colonizer now widespread across the West."},{n:"White-winged Dove",d:"A desert dove with bold white wing-stripes; its 'who-cooks-for-you' cooing is a sound of summer, and it feeds on cactus fruit."},{n:"Mourning Dove",d:"Slim, fast, and abundant; its mournful cooing and whistling wingbeats are everywhere in the Southwest."}],sci:"Columbidae"},{name:"Cuckoos & Roadrunners",items:[{n:"Yellow-billed Cuckoo",d:"A slim, secretive riparian bird called the 'rain crow' for calling on humid days; a threatened cottonwood-willow specialist."},{n:"Greater Roadrunner",d:"An iconic ground-running cuckoo that sprints after lizards and snakes; woven into many Southwestern legends as clever and lucky."}],sci:"Cuculidae"},{name:"Nightjars",items:[{n:"Lesser Nighthawk",d:"A moth-like dusk flier that courses low over the river for insects; roosts invisibly on the ground by day."},{n:"Common Poorwill",d:"A small nightjar that calls its name from rocky slopes; the only bird known to truly hibernate, which the Hopi noted long ago."}],sci:"Caprimulgidae"},{name:"Swifts",items:[{n:"White-throated Swift",d:"A cigar-shaped rocket of the cliffs, among the fastest birds in level flight; nests deep in canyon crevices."}],sci:"Apodidae"},{name:"Hummingbirds",items:[{n:"Black-chinned Hummingbird",d:"The common breeding hummingbird of the corridor; the male's black chin flashes violet in good light."},{n:"Anna's Hummingbird",d:"A hardy hummingbird with a rose-red crown and throat; the male dives with an explosive squeak."},{n:"Costa's Hummingbird",d:"A desert hummingbird; the male's brilliant purple gorget flares out like a mustache."},{n:"Broad-tailed Hummingbird",d:"A mountain hummingbird whose male makes a loud metallic wing-trill in flight; visits the canyon in migration."},{n:"Rufous Hummingbird",d:"A feisty coppery migrant that passes through in numbers, fueling on wildflowers along the way."}],sci:"Trochilidae"},{name:"Rails & Coots",items:[{n:"American Coot",d:"A slate-gray waterbird with a white bill and big lobed toes; dives and dabbles in quiet backwaters."}],sci:"Rallidae"},{name:"Plovers",items:[{n:"Killdeer",d:"A noisy shorebird of gravel bars that feigns a broken wing to lure predators away from its nest."}],sci:"Charadriidae"},{name:"Sandpipers",items:[{n:"Spotted Sandpiper",d:"A small sandpiper that teeters constantly and flies on stiff, fluttering wingbeats low over the water; females hold the territory."}],sci:"Scolopacidae"},{name:"Gulls",items:[{n:"Ring-billed Gull",d:"A tidy medium gull with a black-ringed bill; follows rivers and reservoirs, especially in winter."}],sci:"Laridae"},{name:"Cormorants",items:[{n:"Double-crested Cormorant",d:"A dark, long-necked diver that swims low and perches with wings spread to dry; hunts fish underwater."}],sci:"Phalacrocoracidae"},{name:"Herons & Egrets",items:[{n:"Great Blue Heron",d:"A tall, patient stalker of the shallows that spears fish with a lightning strike; often stands statue-still on the bank."},{n:"Great Egret",d:"A stately all-white heron with a yellow dagger bill; its plumes were once hunted nearly to extinction for hats."},{n:"Snowy Egret",d:"A dainty white egret with 'golden slippers' \u2014 black legs and bright yellow feet it shuffles to stir up prey."}],sci:"Ardeidae"},{name:"New World Vultures",items:[{n:"Turkey Vulture",d:"A teetering soarer with a bare red head that finds carrion by smell, a rare talent among birds; a summer resident."},{n:"California Condor",d:"North America's largest land bird, back from the brink of extinction and reintroduced at nearby Vermilion Cliffs in 1996; each wears numbered wing tags, so report sightings."}],sci:"Cathartidae"},{name:"Osprey",items:[{n:"Osprey",d:"The 'fish hawk' that hovers then plunges talons-first for fish; migrates along the river."}],sci:"Pandionidae"},{name:"Hawks & Eagles",items:[{n:"Bald Eagle",d:"The national bird; winters along the river to fish and scavenge where trout gather, and is sacred to many Native nations."},{n:"Northern Harrier",d:"A low-coursing hawk with a white rump and owl-like face; quarters flats hunting partly by sound."},{n:"Sharp-shinned Hawk",d:"A small, dashing forest hawk that ambushes songbirds; migrates through the canyon in numbers."},{n:"Cooper's Hawk",d:"A crow-sized bird-hunting hawk with a long banded tail; threads through trees after doves and quail."},{n:"Zone-tailed Hawk",d:"A black hawk that mimics a Turkey Vulture, tilting among them to surprise the prey below."},{n:"Red-tailed Hawk",d:"The West's most familiar hawk; its rusty tail and screaming call are a canyon staple \u2014 that scream is the 'eagle' cry in most movies."},{n:"Golden Eagle",d:"A powerful cliff-nesting eagle that takes rabbits and even young bighorn; its feathers are deeply sacred to many tribes."}],sci:"Accipitridae"},{name:"Barn Owls",items:[{n:"Barn Owl",d:"A ghostly, heart-faced owl that hunts rodents by sound in total darkness; gives an eerie raspy shriek."}],sci:"Tytonidae"},{name:"Typical Owls",items:[{n:"Western Screech-Owl",d:"A small eared owl of riparian trees that sings a bouncing-ball series of whistles at night."},{n:"Great Horned Owl",d:"The canyon's apex nocturnal hunter, with ear tufts and deep hooting; takes prey up to skunks and other owls."},{n:"Mexican Spotted Owl",d:"A threatened, dark-eyed owl of shady side canyons; roosts in cool, narrow slots by day."}],sci:"Strigidae"},{name:"Kingfishers",items:[{n:"Belted Kingfisher",d:"A big-headed, rattling bird that hovers then dives for fish; both sexes dig nest burrows in riverbanks."}],sci:"Alcedinidae"},{name:"Woodpeckers",items:[{n:"Red-naped Sapsucker",d:"Drills neat rows of 'wells' in bark and returns to sip the sap and trapped insects; a winter visitor."},{n:"Ladder-backed Woodpecker",d:"A small black-and-white desert woodpecker with a ladder back; taps at cactus, agave, and mesquite."},{n:"Downy Woodpecker",d:"The smallest North American woodpecker; forages on riparian trees and stems, often near cottonwoods."},{n:"Northern Flicker",d:"A large brown woodpecker that feeds on the ground for ants; western birds flash salmon-red under the wings."}],sci:"Picidae"},{name:"Falcons",items:[{n:"American Kestrel",d:"A jay-sized, colorful falcon that hovers over open ground for insects and mice; our smallest falcon."},{n:"Merlin",d:"A small, fierce, fast falcon that runs down songbirds in flight; a winter visitor."},{n:"Prairie Falcon",d:"A pale desert falcon of open cliffs; a low, fast hunter of ground squirrels and birds."},{n:"Peregrine Falcon",d:"The fastest animal alive, diving over 200 mph; the Grand Canyon holds one of the densest nesting populations anywhere."}],sci:"Falconidae"},{name:"Tyrant Flycatchers",items:[{n:"Western Wood-Pewee",d:"A drab flycatcher that sallies from a snag; its burry, descending call is a summer sound of the corridor."},{n:"Willow Flycatcher",d:"A plain 'empid' flycatcher; the Southwestern subspecies is federally endangered and nests in dense riverside willows and tamarisk."},{n:"Black Phoebe",d:"A crisp black-and-white flycatcher that pumps its tail from streamside perches; never far from water."},{n:"Say's Phoebe",d:"A soft apricot-bellied flycatcher of open ground; often the most-seen bird along the river banks."},{n:"Vermilion Flycatcher",d:"The male is a startling flame-red; flutters and hovers in courtship over green riverside spots."},{n:"Ash-throated Flycatcher",d:"A pale desert flycatcher that nests in cavities and feeds on insects and even small lizards in dry washes."},{n:"Brown-crested Flycatcher",d:"A larger, loud summer flycatcher of tall riparian trees; gives a sharp 'whit' call."},{n:"Western Kingbird",d:"A gray-and-yellow flycatcher that fearlessly chases off hawks and ravens; perches on open snags."}],sci:"Tyrannidae"},{name:"Vireos",items:[{n:"Bell's Vireo",d:"A plain, restless vireo of dense willow thickets that sings a rushed, scolding song and nests along the river."},{n:"Plumbeous Vireo",d:"A gray vireo with bold 'spectacles'; a deliberate forager of pinyon-juniper and canyon trees."},{n:"Warbling Vireo",d:"A drab but sweet-voiced vireo whose warbling song drifts from cottonwood canopies in migration."}],sci:"Vireonidae"},{name:"Jays & Crows",items:[{n:"Pinyon Jay",d:"A social blue jay of pinyon-juniper that caches thousands of pine seeds; roving flocks effectively plant future forests."},{n:"Steller's Jay",d:"A dark, crested jay of the higher rims and side canyons; bold, loud, and a skilled mimic."},{n:"Woodhouse's Scrub-Jay",d:"A crestless blue-and-gray jay of pinyon-juniper that caches acorns and pine nuts."},{n:"American Crow",d:"A familiar all-black corvid, smaller than a raven with a fan-shaped tail; social and clever."},{n:"Common Raven",d:"The canyon's ever-present acrobat and problem-solver, a trickster and creator figure across many Native traditions; will raid unguarded camp food."}],sci:"Corvidae"},{name:"Chickadees & Titmice",items:[{n:"Mountain Chickadee",d:"A tiny, tame bird with a white eyebrow; whistles 'cheeseburger' from higher conifers and side canyons."},{n:"Juniper Titmouse",d:"A plain gray crested bird of pinyon-juniper that scolds boldly and hammers open seeds."}],sci:"Paridae"},{name:"Verdin",items:[{n:"Verdin",d:"A tiny gray desert bird with a yellow head; builds conspicuous ball-shaped nests in thorny shrubs."}],sci:"Remizidae"},{name:"Bushtits",items:[{n:"Bushtit",d:"A minute, long-tailed gray bird that travels in busy flocks and weaves a remarkable hanging sock-nest."}],sci:"Aegithalidae"},{name:"Larks",items:[{n:"Horned Lark",d:"A ground bird of open flats with tiny black 'horns' and a face mask; runs rather than hops."}],sci:"Alaudidae"},{name:"Swallows",items:[{n:"Northern Rough-winged Swallow",d:"A plain brown swallow that nests in riverbank burrows and skims insects over the water."},{n:"Bank Swallow",d:"A small colonial swallow with a brown breast-band that digs nest tunnels in cutbanks."},{n:"Violet-green Swallow",d:"A jewel-toned swallow of the cliffs, green above and violet-rumped, flashing white on the face."},{n:"Cliff Swallow",d:"Builds gourd-shaped mud nests in colonies under overhangs and bridges; wheels over the river in tight flocks."},{n:"Barn Swallow",d:"The classic long-tailed, orange-bellied swallow; builds cup nests on ledges and courses low over the water."}],sci:"Hirundinidae"},{name:"Kinglets",items:[{n:"Ruby-crowned Kinglet",d:"A tiny, hyperactive olive bird that flicks its wings; the male hides a scarlet crown patch. A winter visitor."}],sci:"Regulidae"},{name:"Nuthatches",items:[{n:"White-breasted Nuthatch",d:"A stubby bird that creeps head-first down trunks, giving a nasal 'yank-yank' in riparian and pine woods."}],sci:"Sittidae"},{name:"Wrens",items:[{n:"Rock Wren",d:"A pale wren of talus and boulders that bobs constantly and paves its nest entrance with tiny stones."},{n:"Canyon Wren",d:"A rusty cliff wren whose cascading, silvery song spilling down the rock is the definitive sound of the Grand Canyon."},{n:"House Wren",d:"A small, energetic brown wren with a bubbling song; nests in cavities in riparian woods."},{n:"Bewick's Wren",d:"A long-tailed wren with a white eyebrow it flicks side to side; a varied, musical singer."},{n:"Cactus Wren",d:"The Southwest's big, boisterous wren; builds football-sized nests in cholla and gives a low, chugging call."},{n:"Marsh Wren",d:"A secretive wren of cattails and reeds; the male builds many dummy nests and sings a reedy rattle."}],sci:"Troglodytidae"},{name:"Gnatcatchers",items:[{n:"Blue-gray Gnatcatcher",d:"A tiny, slender blue-gray bird with a long white-edged tail it flicks while gleaning insects."},{n:"Black-tailed Gnatcatcher",d:"A desert gnatcatcher of dry washes, mostly black under the tail, giving a rasping call year-round."}],sci:"Polioptilidae"},{name:"Dippers",items:[{n:"American Dipper",d:"A stout gray songbird that walks underwater in rushing streams to feed and bobs endlessly on midstream rocks; look for it on clear tributaries."}],sci:"Cinclidae"},{name:"Thrushes",items:[{n:"Western Bluebird",d:"A deep-blue thrush with a rusty breast that drops from perches to snap up insects in open woods."},{n:"Hermit Thrush",d:"A shy brown thrush with a reddish tail; its flute-like song is among the most beautiful in North America. A winter visitor."},{n:"American Robin",d:"The familiar orange-breasted thrush; gathers at berries and damp ground, common in winter flocks."}],sci:"Turdidae"},{name:"Mockingbirds & Thrashers",items:[{n:"Northern Mockingbird",d:"A gray mimic that strings together the songs of dozens of other birds, singing day and night."},{n:"Crissal Thrasher",d:"A secretive, long-billed thrasher of dense desert thickets, rusty under the tail and heard more than seen."},{n:"Sage Thrasher",d:"A small, streaky thrasher of sagebrush flats; a rich, tireless singer in migration."}],sci:"Mimidae"},{name:"Starlings",items:[{n:"European Starling",inv:1,d:"A glossy, speckled invader introduced to New York in the 1890s; competes aggressively with native cavity-nesters."}],sci:"Sturnidae"},{name:"Silky-flycatchers",items:[{n:"Phainopepla",d:"A slim, glossy-black crested bird with red eyes that eats mistletoe berries and spreads the plant \u2014 the two depend on each other."}],sci:"Ptiliogonatidae"},{name:"Waxwings",items:[{n:"Cedar Waxwing",d:"A sleek, crested bird with waxy red wingtips; roving winter flocks strip berries from riparian trees."}],sci:"Bombycillidae"},{name:"Old World Sparrows",items:[{n:"House Sparrow",inv:1,d:"A chunky sparrow brought from Europe and tied to human settlement, now found near people worldwide."}],sci:"Passeridae"},{name:"Pipits",items:[{n:"American Pipit",d:"A slim ground bird of open shores that walks (not hops) and wags its tail; a winter and migration visitor to gravel bars."}],sci:"Motacillidae"},{name:"Finches",items:[{n:"House Finch",d:"A cheerful red-fronted finch of dry country and towns; the male's red color comes from his diet."},{n:"Cassin's Finch",d:"A raspberry-tinged finch of higher conifer forests that wanders down in winter."},{n:"Pine Siskin",d:"A small, streaky, sharp-billed finch with yellow wing flashes; nomadic winter flocks descend on seeds."},{n:"Lesser Goldfinch",d:"A tiny black-and-gold finch with a sweet, wandering song; feeds on thistle and weed seeds."}],sci:"Fringillidae"},{name:"New World Sparrows",items:[{n:"Green-tailed Towhee",d:"A large sparrow with a rufous cap and greenish tail that scratches in brush and mews like a cat."},{n:"Spotted Towhee",d:"A boldly patterned towhee with red eyes and white-spotted wings that rummages loudly in leaf litter."},{n:"Abert's Towhee",d:"A plain brown towhee with a black face, endemic to Southwestern riparian thickets; stays low in dense cover."},{n:"Chipping Sparrow",d:"A small, clean sparrow with a rusty cap and crisp face lines; trills from open woodland edges."},{n:"Brewer's Sparrow",d:"A plain, finely streaked sparrow of sagebrush that delivers a surprisingly long, buzzy, canary-like song."},{n:"Black-throated Sparrow",d:"A crisp desert sparrow with a black bib and bold white face stripes; thrives on the driest, rockiest ground."},{n:"Lark Sparrow",d:"A large sparrow with a harlequin chestnut-and-white head pattern; forages on open ground."},{n:"Dark-eyed Junco",d:"A tidy gray-and-white sparrow that flashes white outer tail feathers; abundant in winter flocks, with several regional forms."},{n:"White-crowned Sparrow",d:"A handsome sparrow with bold black-and-white head stripes and a clear whistled song; common in winter brush."},{n:"Song Sparrow",d:"A streaky, versatile sparrow of streamside brush that sings a bright, variable song nearly year-round."},{n:"Vesper Sparrow",d:"A streaky sparrow with white outer tail feathers and a white eye-ring that sings most sweetly at dusk."}],sci:"Passerellidae"},{name:"Yellow-breasted Chat",items:[{n:"Yellow-breasted Chat",d:"An oversized, skulking 'warbler' with a brilliant yellow breast and a bizarre medley of whistles, chuckles, and rattles from dense willows."}],sci:"Icteriidae"},{name:"Blackbirds & Orioles",items:[{n:"Red-winged Blackbird",d:"The male flashes red-and-yellow shoulders and sings 'conk-la-ree' from cattails and reeds."},{n:"Brown-headed Cowbird",d:"A brood parasite that lays its eggs in other birds' nests; it followed bison herds historically, and cattle today."},{n:"Great-tailed Grackle",d:"A big, glossy blackbird with a keel-shaped tail and loud, clanking calls; expanding across the Southwest."},{n:"Brewer's Blackbird",d:"A sleek blackbird; the male gleams purple-and-green with a pale eye and forages boldly on open ground."},{n:"Bullock's Oriole",d:"A flame-orange-and-black oriole that weaves a hanging pouch nest in cottonwoods; a signature summer bird of the corridor."},{n:"Hooded Oriole",d:"A slender orange oriole that stitches its nest to the underside of palm and cottonwood leaves; a summer visitor."}],sci:"Icteridae"},{name:"Wood-Warblers",items:[{n:"Orange-crowned Warbler",d:"A plain olive warbler with a rarely-seen orange crown that forages low in brush during migration."},{n:"Lucy's Warbler",d:"A tiny gray desert warbler with a rusty rump \u2014 one of only two cavity-nesting warblers, and the most abundant breeding bird along the river."},{n:"Common Yellowthroat",d:"A masked, wren-like warbler of marshy edges; the male sings a rolling 'witchety-witchety' from the reeds."},{n:"Yellow Warbler",d:"A sweet-singing, all-yellow warbler of willows; the male is streaked chestnut below. A classic riverside breeder."},{n:"Yellow-rumped Warbler",d:"The hardy, adaptable warbler with a signal-yellow rump; by far the most common wintering warbler."},{n:"Black-throated Gray Warbler",d:"A crisp black-white-and-gray warbler with a tiny yellow spot before the eye; a migrant through pinyon-juniper."},{n:"MacGillivray's Warbler",d:"A skulking warbler with a gray hood and white eye-arcs that stays low in streamside tangles during migration."},{n:"Wilson's Warbler",d:"A bright yellow warbler; the male wears a neat black cap. An active, tail-flicking migrant in the willows."}],sci:"Parulidae"},{name:"Cardinals & Tanagers",items:[{n:"Summer Tanager",d:"The male is entirely rose-red \u2014 a bee and wasp specialist that catches them in midair; a prized riparian breeder."},{n:"Western Tanager",d:"A flame-headed, yellow-and-black bird that seems tropical; passes through canyon trees in migration."},{n:"Black-headed Grosbeak",d:"A robin-sized bird with a heavy seed-cracking bill; the male is burnt-orange and black with a rich warbling song."},{n:"Blue Grosbeak",d:"A deep-blue bird with chestnut wingbars and a big silver bill that sings from riverside shrubs in summer."},{n:"Lazuli Bunting",d:"A small finch-like bird; the male is turquoise-blue with a cinnamon breast, singing from open brush."}],sci:"Cardinalidae"}]},{name:"Fish",subs:[{name:"Minnows",items:[{n:"Humpback Chub",d:"An endangered fish found only in the Colorado River basin; its odd fleshy hump and huge fins help it hold position in fierce whitewater."},{n:"Speckled Dace",d:"A small, hardy native minnow of streams and shorelines; breeding males flush red-orange at the mouth and fins."},{n:"Roundtail Chub",d:"A streamlined native chub, once widespread but now essentially gone from the Grand Canyon reach, lost to dams and nonnative fish."},{n:"Red Shiner",inv:1,d:"A small, tough introduced minnow that swarms warm shallows and competes with and preys on young native fish."},{n:"Fathead Minnow",inv:1,d:"A hardy little nonnative minnow widely sold as bait; abundant in backwaters where it eats native fish eggs and larvae."}],sci:"Leuciscidae"},{name:"Carp",items:[{n:"Common Carp",inv:1,d:"A big introduced bottom-feeder from Eurasia that roots up sediment and muddies backwaters, harming native habitat."}],sci:"Cyprinidae"},{name:"Suckers",items:[{n:"Flannelmouth Sucker",d:"A large native sucker with thick, fleshy lips for scraping algae and insects off rocks; still common but declining basin-wide."},{n:"Bluehead Sucker",d:"A native sucker with a cartilage-edged mouth for scraping algae from stones; the male's head flushes blue-green when spawning."},{n:"Razorback Sucker",d:"An endangered native sucker with a sharp keel behind its head; long-lived and now bolstered by hatchery-raised stockings."}],sci:"Catostomidae"},{name:"Trout",items:[{n:"Rainbow Trout",inv:1,d:"A popular introduced sport fish thriving in the cold, clear tailwater below Glen Canyon Dam; also preys on young native fish."},{n:"Brown Trout",inv:1,d:"An introduced European trout and a wary predator that takes native fish; targeted for removal to protect the humpback chub."}],sci:"Salmonidae"},{name:"Catfish",items:[{n:"Channel Catfish",inv:1,d:"A large introduced, whiskered predator of warm reaches that hunts by smell at night and eats native fish."},{n:"Black Bullhead",inv:1,d:"A small introduced catfish of muddy backwaters, tolerant of warm, low-oxygen water."}],sci:"Ictaluridae"},{name:"Sunfish & Bass",items:[{n:"Smallmouth Bass",inv:1,d:"A voracious introduced predator whose recent spread below the dam is a top threat to the humpback chub."},{n:"Green Sunfish",inv:1,d:"A small, aggressive introduced sunfish of warm sloughs that punches above its weight eating native fry."}],sci:"Centrarchidae"},{name:"Temperate Bass",items:[{n:"Striped Bass",inv:1,d:"A large introduced predator that moves up from downstream reservoirs and can eat sizable native fish."}],sci:"Moronidae"},{name:"Killifish",items:[{n:"Plains Killifish",inv:1,d:"A small, banded introduced fish of warm, shallow margins and backwaters."}],sci:"Fundulidae"}]},{name:"Mammals",subs:[{name:"Cats",items:[{n:"Mountain Lion",d:"The canyon's great cat \u2014 solitary, wide-ranging, and rarely seen; follows deer and bighorn through rough country."},{n:"Bobcat",d:"A stub-tailed wildcat about twice house-cat size; an ambush hunter of rabbits and rodents, mostly seen at dawn and dusk."}],sci:"Felidae"},{name:"Dogs & Foxes",items:[{n:"Coyote",d:"The adaptable desert survivor whose yips echo off the walls at night; the clever trickster in countless Native stories."},{n:"Gray Fox",d:"A small fox that can climb trees, grizzled gray with a black-tipped tail, active mostly after dark."},{n:"Kit Fox",d:"A tiny, huge-eared fox of open desert flats that hunts by night and rarely needs to drink, taking water from its prey."}],sci:"Canidae"},{name:"Skunks",items:[{n:"Striped Skunk",d:"The familiar black-and-white skunk that ambles the river banks at night and warns before deploying its famous spray."},{n:"Western Spotted Skunk",d:"A small, agile skunk that does a warning handstand before spraying; a nimble climber and nocturnal hunter."}],sci:"Mephitidae"},{name:"Weasels & Badgers",items:[{n:"American Badger",d:"A powerful, low-slung digger with huge claws that excavates rodents and can vanish into the earth in minutes."}],sci:"Mustelidae"},{name:"Ringtail & Raccoon",items:[{n:"Ringtail",d:"A wide-eyed, cat-sized relative of the raccoon nicknamed the 'miner's cat'; Arizona's state mammal, purely nocturnal and a superb climber."},{n:"Common Raccoon",d:"The masked, ring-tailed bandit of streamsides; its dextrous paws probe water and camp gear alike."}],sci:"Procyonidae"},{name:"Deer",items:[{n:"Mule Deer",d:"The canyon's common deer, named for its big mule-like ears; browses green benches and bounds off in a stiff-legged 'stott.'"}],sci:"Cervidae"},{name:"Bighorn Sheep",items:[{n:"Desert Bighorn Sheep",d:"The canyon's icon of the cliffs \u2014 sure-footed rams with massive curled horns; a favorite subject of ancient petroglyphs."}],sci:"Bovidae"},{name:"Squirrels & Chipmunks",items:[{n:"Cliff Chipmunk",d:"A soft-gray chipmunk of rocky slopes and pinyon-juniper that dashes over boulders with its tail held high."},{n:"Rock Squirrel",d:"A large gray ground squirrel of the canyon's rocks and camps; bold, curious, and quick to raid unguarded food."},{n:"Harris's Antelope Squirrel",d:"A small ground squirrel with a white side stripe that runs with its tail flipped over its back; active even in fierce heat."}],sci:"Sciuridae"},{name:"Pocket Mice & Kangaroo Rats",items:[{n:"Rock Pocket Mouse",d:"A tiny, fur-lined-cheeked mouse of lava and rocks; desert forms evolve dark coats to match black rock."},{n:"Merriam's Kangaroo Rat",d:"A hopping, big-eyed rodent that never needs to drink \u2014 it makes water from dry seeds and bounds on huge hind feet."},{n:"Ord's Kangaroo Rat",d:"A bipedal, long-tailed seed-hoarder of sandy ground that drums with its feet and lives on metabolic water."}],sci:"Heteromyidae"},{name:"Beaver",items:[{n:"American Beaver",d:"The river's engineer; canyon beavers den in bank burrows rather than build lodges. Once trapped heavily along the Colorado."}],sci:"Castoridae"},{name:"Porcupine",items:[{n:"North American Porcupine",d:"A slow, quill-armored rodent that climbs trees to gnaw bark; its quills detach on contact but are not thrown."}],sci:"Erethizontidae"},{name:"Mice & Woodrats",items:[{n:"Canyon Mouse",d:"A soft-furred, big-eared native mouse of rocky slopes and ledges, agile among the boulders at night."},{n:"Deer Mouse",d:"The ubiquitous big-eyed native mouse and a key food for owls and snakes; a known hantavirus carrier, so keep food sealed."},{n:"Brush Mouse",d:"A long-tailed native mouse of brushy, rocky slopes; a nimble climber in shrubs and rock piles."},{n:"Western Harvest Mouse",d:"A tiny native mouse that weaves a ball-shaped grass nest and feeds on seeds in grassy patches."},{n:"White-throated Woodrat",d:"The desert 'packrat' that builds big stick middens among cactus and hauls off shiny objects; ancient middens preserve a record of past climate."},{n:"Muskrat",d:"A stocky aquatic rodent with a rope-like tail that swims marshy backwaters feeding on cattails and reeds."}],sci:"Cricetidae"},{name:"Old World Mice",items:[{n:"House Mouse",inv:1,d:"The small introduced mouse of Old World origin that travels with people and turns up around camps and gear."}],sci:"Muridae"},{name:"Rabbits & Hares",items:[{n:"Desert Cottontail",d:"A pale, big-eared rabbit of brushy flats that freezes then bolts in a zigzag; food for nearly every canyon predator."},{n:"Black-tailed Jackrabbit",d:"A long-eared hare (not a rabbit) that sprints in great bounds; its huge ears shed heat in the desert sun."}],sci:"Leporidae"},{name:"Vesper Bats",items:[{n:"Canyon Bat",d:"The Southwest's smallest bat (formerly 'Western Pipistrelle'); a weak, fluttery flier out early at dusk over the water."},{n:"Townsend's Big-eared Bat",d:"A bat with enormous rabbit-like ears; an agile, moth-hunting flier that roosts in caves and old mines."},{n:"Pallid Bat",d:"A pale, big-eared bat that gleans scorpions and centipedes off the ground \u2014 and is immune to scorpion stings."},{n:"Big Brown Bat",d:"A robust, common bat that emerges at dusk to hawk beetles over water and camp."},{n:"California Myotis",d:"A tiny mouse-eared bat with quick, erratic flight that forages low over the river for small insects."},{n:"Hoary Bat",d:"A large, frost-tipped, tree-roosting bat that migrates long distances; a high, fast flier late in the evening."}],sci:"Vespertilionidae"},{name:"Free-tailed Bats",items:[{n:"Brazilian Free-tailed Bat",d:"A fast, high-flying bat with a tail extending past its membrane; famous for massive colonies and long foraging flights."}],sci:"Molossidae"},{name:"Horses & Burros",items:[{n:"Feral Burro",inv:1,d:"Descendants of prospectors' pack animals; tough desert survivors whose grazing and trampling damage springs and native plants, so they are managed as invasive."}],sci:"Equidae"}]},{name:"Plants",subs:[{name:"Ferns",items:[{n:"Maidenhair Fern",d:"A delicate fern of shaded seeps and dripping walls; its wiry black stems were prized for the black patterns in Indigenous basketry."},{n:"Giant Chain Fern",d:"A large fern of permanent seeps and hanging gardens; a lush surprise in the desert where water never stops."}]},{name:"Horsetails",items:[{n:"Common Horsetail",d:"An ancient, jointed, leafless plant of wet banks; its gritty, silica-rich stems were used to scour pots, earning the name 'scouring rush.'"}],sci:"Equisetaceae"},{name:"Ephedra",items:[{n:"Mormon Tea",d:"A jointed, leafless green shrub whose stems were long brewed into a tonic tea by Indigenous peoples and settlers, the source of the 'Mormon tea' name."}],sci:"Ephedraceae"},{name:"Junipers",items:[{n:"Utah Juniper",d:"A gnarled, drought-hardy tree of the rims and slopes; its blue berry-like cones flavored food and medicine, and its shreddy bark and wood had countless uses."}],sci:"Cupressaceae"},{name:"Pines",items:[{n:"Two-needle Pinyon",d:"The pinyon pine of the plateau; its rich, fatty pine nuts were and remain a treasured traditional food across the Southwest."}],sci:"Pinaceae"},{name:"Agaves & Yuccas",items:[{n:"Utah Agave",d:"A rosette of stiff, spine-tipped leaves that blooms once on a tall stalk then dies; its roasted hearts were a staple food and its fibers made cordage and sandals."},{n:"Desert Agave",d:"A blue-gray agave of rocky slopes, roasted in stone pits for a sweet, nutritious food and a source of strong fiber."},{n:"Banana Yucca",d:"Named for its fat, banana-like fruit that was roasted and eaten; the leaves gave fiber and the roots a natural soap."},{n:"Soaptree Yucca",d:"A tree-like yucca whose roots ('amole') lather into soap and shampoo; its leaves split into cordage, sandals, and baskets."},{n:"Mojave Yucca",d:"A shaggy desert yucca with sharp leaves; a classic source of fiber for rope, mats, and sandals, with edible flowers and fruit."}],sci:"Asparagaceae"},{name:"Cattails",items:[{n:"Broadleaf Cattail",d:"The classic marsh plant; nearly every part is useful \u2014 starchy roots and pollen for food, fluff for insulation, leaves for mats and thatch."}],sci:"Typhaceae"},{name:"Grasses",items:[{n:"Indian Ricegrass",d:"A graceful bunchgrass whose plump seeds were a vital ground-into-meal food for desert peoples, especially in lean years."},{n:"Sand Dropseed",d:"A wispy native bunchgrass of sandy ground whose tiny seeds were gathered and ground for food."},{n:"Common Reed",d:"A tall riverside cane (Phragmites) whose straight, hollow stems were made into arrow shafts, flutes, mats, and construction material."},{n:"Three-awn Grass",d:"A fine native bunchgrass named for the three bristly awns on each seed, which cling to fur and socks alike."},{n:"Ravenna Grass",inv:1,d:"A giant ornamental plume-grass gone wild along the river; an aggressive invader that river crews pull out by hand at camps."},{n:"Red Brome",inv:1,d:"A fine invasive annual grass from Eurasia that cures to tinder and helps carry desert fires into places that rarely burned."},{n:"Cheatgrass",inv:1,d:"An invasive annual grass that greens up early then dries to fuel; its needle-sharp seeds work into socks and fur and drive destructive fire cycles."},{n:"Bermuda Grass",inv:1,d:"A tough, spreading introduced lawn grass now naturalized on riverside sandbars and disturbed ground."}],sci:"Poaceae"},{name:"Orchids",items:[{n:"Stream Orchid",d:"A native orchid of seeps and springs (also called chatterbox); its greenish, wine-veined flowers are a hidden treasure of wet canyon walls."}],sci:"Orchidaceae"},{name:"Ocotillo",items:[{n:"Ocotillo",d:"Not a cactus but a bundle of spiny, whip-like canes that leaf out after rain and flame with red flowers hummingbirds love; the canes were planted as living fences."}],sci:"Fouquieriaceae"},{name:"Cacti",items:[{n:"Engelmann's Prickly Pear",d:"A broad-padded cactus whose fruits ('tunas') and young pads ('nopales') are traditional foods; the pads were also split as a cooling poultice."},{n:"Pancake Prickly Pear",d:"Named for its round, flat, blue-green pads; it bears edible red fruit and hosts the cochineal insect once used for crimson dye."},{n:"Beavertail Cactus",d:"A spineless-looking prickly pear (it has tiny barbed glochids instead) with vivid magenta blooms; its buds and fruit were eaten."},{n:"Claret Cup",d:"A mound-forming hedgehog cactus that lights up with brilliant scarlet, hummingbird-pollinated cups in spring; its fruit is edible."},{n:"Strawberry Hedgehog",d:"A small clustering cactus with magenta flowers and sweet, strawberry-flavored fruit that was gathered as a treat."},{n:"Barrel Cactus",d:"A stout ribbed cactus that leans south (the 'compass cactus'); its curved spines made fishhooks and awls, but it is not a reliable water source."},{n:"Buckhorn Cholla",d:"A branching cholla with antler-like joints whose buds were pit-roasted as a calcium-rich food."},{n:"Teddy-bear Cholla",d:"A fuzzy-looking but vicious cholla whose barbed joints detach at a touch \u2014 the notorious 'jumping cholla.' Handle with extreme care."},{n:"Fishhook Cactus",d:"A small barrel-shaped cactus armored with hooked central spines that catch like fishhooks; it bears red fruit."}],sci:"Cactaceae"},{name:"Poison Ivy & Sumac",items:[{n:"Western Poison Ivy",d:"A native shrub or vine of shady side canyons with glossy leaves-of-three; its oil (urushiol) causes a nasty rash, so 'leaves of three, let it be.'"},{n:"Skunkbush Sumac",d:"An aromatic three-leaflet shrub whose tart red berries make a lemonade-like drink; its straight young stems are a premier basketry material."}],sci:"Anacardiaceae"},{name:"Creosote Bush",items:[{n:"Creosote Bush",d:"The signature evergreen shrub of the low desert, its resinous leaves giving off the smell of desert rain; a cornerstone of Indigenous medicine."}],sci:"Zygophyllaceae"},{name:"Hackberry",items:[{n:"Netleaf Hackberry",d:"A tough streamside tree with net-veined leaves; its small orange berries are sweet and were gathered as food by people and wildlife alike."}],sci:"Cannabaceae"},{name:"Willows & Cottonwoods",items:[{n:"Coyote Willow",d:"A slender, thicket-forming willow; its flexible withes are a foundational basketry material for canyon tribes, and its bark holds a natural aspirin-like compound."},{n:"Goodding's Willow",d:"A large native tree willow that shades sandbars; its bark and withes were used for cordage, baskets, and medicine."},{n:"Fremont Cottonwood",d:"The great shade tree that marks water in the desert; Hopi carvers traditionally shape katsina (kachina) dolls from its soft root wood."}],sci:"Salicaceae"},{name:"Rose Family",items:[{n:"Blackbrush",d:"A dense, dark, thorny shrub that forms vast gray-black stands on desert benches; important winter browse for bighorn and deer."},{n:"Apache Plume",d:"An airy shrub with white rose-like flowers followed by feathery pinkish seed plumes; its twigs served as brooms and arrow shafts."},{n:"Cliff Rose",d:"A fragrant cliff shrub (the 'quinine bush') whose shreddy bark was pounded into cordage, mats, sandals, and padding; prized browse for deer."}],sci:"Rosaceae"},{name:"Legumes",items:[{n:"Catclaw Acacia",d:"A thorny legume tree armed with hooked 'cat-claw' spines \u2014 the 'wait-a-minute bush'; its pods were ground into meal and its wood burned hot."},{n:"Mesquite",d:"A spreading desert legume whose sweet pods were a dietary staple, ground into flour and fermented into drinks; the hard wood fueled fires and tools."},{n:"New Mexico Locust",d:"A thorny legume with showy pink pea-flowers; the blossoms were eaten and the wood was hard and durable."},{n:"Redbud",d:"A small tree that clouds pink-magenta before leafing out; its flowers are edible and its slender shoots are a valued red basketry element."},{n:"Camelthorn",inv:1,d:"A deep-rooted, viciously spiny invasive legume from central Asia; it spreads along the river and is dug out by park crews at camps."}],sci:"Fabaceae"},{name:"Oleasters",items:[{n:"Russian Olive",inv:1,d:"A silvery, thorny invasive tree from Eurasia that crowds out native willows and cottonwoods along the corridor and is targeted for removal."}],sci:"Elaeagnaceae"},{name:"Tamarisk",items:[{n:"Saltcedar (Tamarisk)",inv:1,d:"A feathery pink-plumed invasive tree from Eurasia that guzzles water and salts the soil, choking native banks \u2014 now knocked back by an introduced leaf beetle."}],sci:"Tamaricaceae"},{name:"Quassia Family",items:[{n:"Tree of Heaven",inv:1,d:"A fast-growing, foul-smelling invasive tree that sprouts aggressively from its roots; crews watch for it moving into cleared tamarisk gaps."}],sci:"Simaroubaceae"},{name:"Mallows",items:[{n:"Desert Globemallow",d:"A silvery-leaved plant topped with apricot-orange cups; its fine leaf hairs can irritate the eyes, earning the name 'sore-eye poppy.'"}],sci:"Malvaceae"},{name:"Mustards",items:[{n:"Prince's Plume",d:"A tall native mustard with golden feathery plumes; it flags selenium-rich soil, and its greens were parboiled and eaten with care."},{n:"Sahara Mustard",inv:1,d:"An aggressive invasive annual mustard that carpets disturbed ground and sandbars, crowding out native wildflowers; a top removal target at Lees Ferry."},{n:"Perennial Pepperweed",inv:1,d:"A deep-rooted invasive mustard ('tall whitetop') that forms dense white-flowered stands and is very hard to eradicate once established."},{n:"London Rocket",inv:1,d:"A weedy invasive mustard that springs up in disturbed sandy soil after rain, with small yellow flowers and a peppery bite."}],sci:"Brassicaceae"},{name:"Amaranths",items:[{n:"Fourwing Saltbush",d:"A silvery, salt-tolerant native shrub with papery four-winged seeds; its seeds were ground for food and its ashes used to color and enrich Hopi blue-corn dishes."},{n:"Russian Thistle",inv:1,d:"The classic tumbleweed \u2014 an invasive annual that dries, snaps off, and rolls, scattering seed; young shoots are edible but the mature plant is a spiny nuisance."}],sci:"Amaranthaceae"},{name:"Four O'Clocks",items:[{n:"Sand Verbena",d:"A low, sticky, sand-loving plant with fragrant pink flower clusters that scent the dunes, especially in the evening."},{n:"Colorado Four O'Clock",d:"A native with magenta trumpet flowers that open in late afternoon; its deep starchy root was used medicinally in the Southwest."}],sci:"Nyctaginaceae"},{name:"Evening Primroses",items:[{n:"Tufted Evening Primrose",d:"A stemless plant whose big white blooms open at dusk and fade pink by morning, pollinated by night-flying hawkmoths."},{n:"Hooker's Evening Primrose",d:"A tall primrose with large lemon-yellow flowers that open in the evening and wilt by midday."}],sci:"Onagraceae"},{name:"Nightshades",items:[{n:"Sacred Datura",d:"A sprawling plant with huge white moonflower trumpets that open at night; sacred and used ceremonially by some Southwestern peoples, but powerfully toxic and potentially deadly \u2014 admire, never touch."},{n:"Desert Tobacco",d:"A wild native tobacco with pale tubular flowers, smoked ceremonially by Indigenous peoples long before commercial tobacco."},{n:"Tree Tobacco",inv:1,d:"A rangy invasive shrub from South America with tubular yellow flowers; despite the name it is highly toxic and must never be smoked or eaten."}],sci:"Solanaceae"},{name:"Ash",items:[{n:"Velvet Ash",d:"A native streamside tree with velvety twigs that shades springs and side canyons and turns gold in autumn along the water."}],sci:"Oleaceae"},{name:"Desert Willow",items:[{n:"Desert Willow",d:"Not a true willow but a catalpa relative with orchid-like pink trumpet flowers; its slender wood was used for bows and its flowers steeped as a tea."}],sci:"Bignoniaceae"},{name:"Monkeyflowers",items:[{n:"Crimson Monkeyflower",d:"A brilliant scarlet wildflower of dripping seeps and streambanks, its tubular blooms tailored to hummingbirds; the greens are edible."}],sci:"Phrymaceae"},{name:"Penstemons",items:[{n:"Palmer's Penstemon",d:"A tall, fragrant penstemon with big pale-pink pouched flowers beloved by bees; a showy accent on rocky slopes."},{n:"Utah Penstemon",d:"A low penstemon that spangles the spring desert with vivid blue-to-lavender tubular flowers."}],sci:"Plantaginaceae"},{name:"Poppies",items:[{n:"Prickly Poppy",d:"A spiny, thistle-like plant with crinkled white tissue-paper petals and yellow-orange sap; toxic, though the sap was applied traditionally to skin ailments."}],sci:"Papaveraceae"},{name:"Alder",items:[{n:"Arizona Alder",d:"A streamside tree of permanent water with small woody 'cones'; a marker of reliable springs and creeks deep in side canyons."}],sci:"Betulaceae"},{name:"Sycamore",items:[{n:"Arizona Sycamore",d:"A large streamside tree with mottled white bark and huge maple-like leaves; a landmark of major side-canyon creeks."}],sci:"Platanaceae"},{name:"Sunflower Family",items:[{n:"Brittlebush",d:"A round desert shrub of silver leaves and golden daisies; its fragrant resin was burned as incense in Spanish missions and used as glue and salve."},{n:"Desert Broom",d:"A broom-like green shrub of washes and disturbed ground; in fall the females release clouds of silky, wind-borne seed."},{n:"Burrobush",d:"A low, gray, much-branched shrub (bursage) that anchors vast stretches of desert flat and shelters the seedlings of larger plants."},{n:"Arrowweed",d:"A tall, straight-stemmed streamside shrub whose slender canes were bundled for arrow shafts, thatch, roasting racks, and cradleboards."},{n:"Seep Willow",d:"A willow-leaved shrub (not a true willow) that lines wet sandbars; its straight stems were used for construction, arrows, and simple tools."},{n:"Desert Marigold",d:"A cheerful desert wildflower with long-lasting lemon-yellow daisies on silvery foliage; it blooms after rain in almost any season."},{n:"Russian Knapweed",inv:1,d:"A toxic invasive from Eurasia with lavender thistle-like heads that poisons the soil against competitors; a serious rangeland pest."}],sci:"Asteraceae"},{name:"Mistletoe",items:[{n:"Desert Mistletoe",d:"A leafless parasitic tangle on mesquite and acacia; its sticky berries feed and are spread by the Phainopepla, though they are toxic to people."}],sci:"Santalaceae"}]},{name:"Reptiles",subs:[{name:"Collared & Leopard Lizards",items:[{n:"Great Basin Collared Lizard",d:"A big-headed lizard with bold black neck-bands; males turn bright green-blue and can sprint upright on their hind legs."},{n:"Long-nosed Leopard Lizard",d:"A large, spotted, long-bodied lizard that ambushes insects and smaller lizards; gravid females flush orange."}],sci:"Crotaphytidae"},{name:"Spiny, Fence & Horned Lizards",items:[{n:"Common Side-blotched Lizard",d:"A small, abundant lizard with a dark blotch behind each foreleg; the first lizard you'll see basking on almost any rock."},{n:"Ornate Tree Lizard",d:"A slim, quick lizard of tree trunks, boulders, and canyon walls; males flash blue-green throat patches in display."},{n:"Eastern Fence Lizard",d:"A spiny gray lizard whose males show flashy blue belly patches ('blue-bellies'); bobs and does 'push-ups' to signal."},{n:"Common Sagebrush Lizard",d:"A small spiny lizard of brushy, higher ground; males show blue throat and belly patches."},{n:"Desert Spiny Lizard",d:"A large, rough-scaled lizard with black shoulder wedges; a bold basker that scampers up trees and rocks."},{n:"Desert Horned Lizard",d:"The flat, spiky 'horny toad' that eats ants and hunkers to match the sand; it can even squirt blood from its eyes to startle predators."},{n:"Greater Short-horned Lizard",d:"A rounded, short-spined horned lizard of higher elevations that gives live birth rather than laying eggs."}],sci:"Phrynosomatidae"},{name:"Iguanas & Chuckwallas",items:[{n:"Chuckwalla",d:"A big, potbellied plant-eating lizard that wedges into rock cracks and gulps air to swell up tight; long a traditional food."},{n:"Desert Iguana",d:"A pale, heat-loving lizard active in the hottest hours that feeds heavily on creosote flowers and leaves."}],sci:"Iguanidae"},{name:"Whiptails",items:[{n:"Western Whiptail",d:"A slender, striped, always-moving lizard that jerks along nosing under litter for insects."},{n:"Tiger Whiptail",d:"A fast, striped-and-spotted whiptail of open desert, forever foraging with twitchy, restless movements."},{n:"Plateau Striped Whiptail",d:"An all-female species that reproduces by cloning \u2014 every individual is female and lays fertile eggs without males."}],sci:"Teiidae"},{name:"Geckos",items:[{n:"Western Banded Gecko",d:"A soft-skinned, nocturnal little gecko with translucent banded skin that squeaks when caught and waves its tail like a cat."}],sci:"Eublepharidae"},{name:"Gila Monster",items:[{n:"Gila Monster",d:"One of only a few venomous lizards on Earth \u2014 a stout, beaded black-and-orange giant; rare in the far western canyon and fully protected. Leave it be."}],sci:"Helodermatidae"},{name:"Colubrid Snakes",items:[{n:"Gophersnake",d:"A large, powerful constrictor that mimics a rattler when alarmed, hissing and buzzing its tail, but is completely harmless."},{n:"Coachwhip",d:"A long, fast, whip-thin snake (often a pinkish 'red racer' here) that hunts actively by day, racing down lizards in the heat."},{n:"Desert Striped Whipsnake",d:"A slender, speedy, striped snake with big eyes; a fast diurnal hunter of lizards and other snakes."},{n:"Sonoran Whipsnake",d:"An agile, olive-striped racer that even climbs into shrubs after lizards and is quick to flee."},{n:"Common Kingsnake",d:"A glossy banded constrictor that famously eats other snakes \u2014 including rattlesnakes, whose venom it shrugs off."},{n:"Wandering Gartersnake",d:"A watchful streamside snake that hunts fish, tadpoles, and frogs in the shallows and dives readily when startled."},{n:"Black-necked Gartersnake",d:"A handsome striped, water-loving snake of desert creeks and springs that forages for amphibians along the edges."},{n:"Nightsnake",d:"A small, secretive snake with vertical cat-like pupils, mildly venomous to its prey but harmless to people and active after dark."},{n:"Ring-necked Snake",d:"A small dark snake with a bright neck ring and a vivid orange belly it curls up to flash as a warning."},{n:"Western Patch-nosed Snake",d:"A fast striped desert snake with an enlarged 'patch' scale on its snout used to dig out lizard eggs."},{n:"Long-nosed Snake",d:"A gentle, banded burrowing snake with an upturned snout; nocturnal and harmless, sometimes mistaken for a coral snake."}],sci:"Colubridae"},{name:"Threadsnakes",items:[{n:"Western Threadsnake",d:"A tiny, shiny, worm-like burrowing snake barely thicker than a noodle that lives underground eating ant and termite brood."}],sci:"Leptotyphlopidae"},{name:"Vipers",items:[{n:"Grand Canyon Rattlesnake",d:"A pink-to-salmon rattlesnake found only in the canyon, its color tuned to the local rock; venomous \u2014 give it room and it will leave you alone."},{n:"Speckled Rattlesnake",d:"A finely speckled rattler that blends perfectly with granite and limestone; venomous, and best simply avoided."},{n:"Black-tailed Rattlesnake",d:"A mild-mannered rattler with a solid black tail; venomous but generally reluctant to strike."},{n:"Western Diamond-backed Rattlesnake",d:"The large, boldly diamond-patterned rattler with a black-and-white 'coon-tail'; venomous and defensive, so watch hands and feet at rest stops."},{n:"Great Basin Rattlesnake",d:"A blotched rattler of higher, cooler ground; venomous, and like all rattlers it would rather warn than bite."}],sci:"Viperidae"},{name:"Tortoises",items:[{n:"Desert Tortoise",d:"A long-lived desert reptile that digs burrows and can live for decades; protected \u2014 never handle one, as a startled tortoise may empty its precious stored water."}],sci:"Testudinidae"},{name:"Softshell Turtles",items:[{n:"Spiny Softshell",inv:1,d:"A flat, leathery, pancake-shaped introduced turtle with a snorkel-like snout; a nonnative in the river that can deliver a quick bite."}],sci:"Trionychidae"}]}],almanac:{indigenous:[["Twelve thousand years of people","People have lived in and around the Grand Canyon for at least 12,000 years, since Paleo-Indian hunters followed game across the plateaus at the end of the Ice Age. The canyon has never been empty wilderness \u2014 it is, and always has been, a homeland."],["Split-twig figurines","In caves high in the Redwall limestone, archaeologists found tiny animal figures \u2014 deer and bighorn \u2014 folded from single split willow and cottonwood twigs, some 3,000 to 4,000 years old. Left by Archaic hunter-gatherers, likely as hunting offerings, they are among the oldest human traces in the canyon; Stanton\u2019s Cave near Mile 32 held hundreds."],["The Ancestral Puebloans and the river farms","From roughly AD 500 to 1200, Ancestral Puebloan people (once called \u2018Anasazi\u2019) farmed corn, beans, and squash on the river\u2019s silt deltas \u2014 Unkar (Mile 72) and Nankoweap among them \u2014 and up on the rims. Thousands of sites remain: dwellings, granaries, roasting pits, check dams, and rock art."],["The Nankoweap granaries","High in the cliff above Nankoweap (Mile 53), a row of stone-and-mud storage rooms built around AD 1100 still gazes out over the river \u2014 among the most evocative ruins in the canyon. Ancestral Puebloans stored grain there, safe from floods and rodents. Look and photograph, but never enter or touch."],["Bright Angel Pueblo, at Phantom Ranch","Right where you\u2019ll tie up boats at Phantom Ranch (Mile 88), just west of the Black Bridge, sits Bright Angel Pueblo \u2014 pit houses and a ceremonial kiva built by an extended Ancestral Puebloan family around AD 1050, at the mouth of Bright Angel Creek. Powell\u2019s 1869 party camped on this beach and found the ruin. Wayside panels now interpret it; admire from the trail and don\u2019t climb on the walls."],["Agave roasting pits","Look for low rings or mounds of fire-cracked, blackened rock tucked near many camps and side canyons, more common through the western half of the canyon. These are agave roasting pits: agave hearts were piled on coals, covered with earth, and slow-roasted for days to convert the plant\u2019s starches into something sweet and edible \u2014 a technique Pai and Paiute peoples still practice today."],["The Cohonina and the Pai peoples","West of the Ancestral Puebloans lived the Cohonina, likely ancestors of today\u2019s Pai peoples \u2014 the Havasupai and Hualapai \u2014 who have lived along the western canyon for many centuries."],["The Hopi: place of emergence","For the Hopi, the Grand Canyon is sacred ground. Near the confluence of the Little Colorado River lies the Sipapuni, a golden travertine dome the Hopi hold as the place where their ancestors emerged into this world. The canyon and the Little Colorado remain central to Hopi religion today."],["The Hopi salt pilgrimage","For generations, Hopi men made arduous pilgrimages to sacred salt deposits below the Little Colorado confluence, gathering salt and leaving offerings along a prescribed ceremonial route. The area is deeply sacred \u2014 the salt mines are closed to all visitors."],["The Havasupai: people of the blue-green water","The Havasupai (\u2018people of the blue-green water\u2019) are the only people who still live within the canyon, in Supai village deep in Havasu Canyon with its turquoise travertine waterfalls. For centuries they farmed the side canyon in summer and wintered on the rim \u2014 including the land that is now Grand Canyon Village."],["Land taken \u2014 and returned","When the forest reserve and then the national park were created, the Havasupai were confined in 1882 to a tiny 518-acre reservation and pushed off their rim lands. After a decades-long fight, the Grand Canyon National Park Enlargement Act of 1975 returned about 185,000 acres to the Havasupai \u2014 one of the largest restorations of land to a tribe in U.S. history."],["The Hualapai: people of the tall pines","The Hualapai hold the western South Rim and much of the river\u2019s left bank from about Mile 165 to 274. Diamond Creek \u2014 the canyon\u2019s only road down to the river, and your resupply point \u2014 sits on Hualapai land, as does Grand Canyon West. Camping and hiking river-left through their reach requires tribal permission."],["Deer Creek: gateway to the spirit world","At Mile 136, a narrow slot canyon below Deer Creek Falls holds deep meaning for the Southern Paiute, who used this drainage for centuries: the slot is regarded as a passage for spirits moving from this life to the next. Some rock art panels in the area remain sacred to Southern Paiute people today. Enjoy the Patio above, but treat the narrows themselves with quiet respect and leave any rock art undisturbed and unphotographed."],["Southern Paiute, Navajo, and Zuni","The Kaibab and San Juan Southern Paiute lived north of the river; the Navajo (Din\xE9) hold the eastern rim and much of the Marble Canyon country; and the Zuni trace ancestral ties and pilgrimage routes into the canyon. In all, the National Park Service recognizes eleven traditionally associated tribes."],["A living connection","These are not vanished cultures. The eleven associated tribes maintain deep spiritual, cultural, and physical ties to the canyon today and are increasingly partners in its care. As you travel, treat every ruin, spring, and salt deposit as someone\u2019s church \u2014 because it is."]],explore:[["C\xE1rdenas, 1540: the first Europeans","In 1540, a Spanish party under Garc\xEDa L\xF3pez de C\xE1rdenas \u2014 sent by Coronado to chase rumors of golden cities \u2014 became the first Europeans to see the Grand Canyon, led to the South Rim by Hopi guides. Unable to find a way down to the river and short on water, they left, and Europeans largely ignored the canyon for two centuries."],["The friars, 1776","In 1776, Franciscan priests passed through the region. Francisco Garc\xE9s visited the Havasupai in their canyon home, while the Dom\xEDnguez\u2013Escalante expedition, seeking a route to California, forded the Colorado upstream at a spot still called the Crossing of the Fathers \u2014 now beneath Lake Powell."],["\u2018Altogether valueless,\u2019 1858","Lieutenant Joseph Ives steamed a boat up the lower Colorado in 1857\u201358 until it wrecked, then explored inland. His report dismissed the region as \u2018altogether valueless\u2019 and predicted the Grand Canyon would be \u2018forever unvisited and undisturbed.\u2019 History has rarely been so wrong."],["The one-armed major","John Wesley Powell was a self-taught geology professor and Union artillery officer who lost his right arm at Shiloh in 1862, the ball shattering it below the elbow. Undeterred, he spent the late 1860s exploring the Rockies, and in 1869 talked Congress into a small stipend and the Army into surplus rations for an expedition that professional explorers considered close to suicidal."],["Powell\u2019s first descent, 1869","In May 1869, John Wesley Powell \u2014 a one-armed Civil War veteran \u2014 led ten men in four wooden boats from Green River, Wyoming, into country no map described. Three months later they became the first documented expedition to run the Grand Canyon, surveying and naming as they went. They nearly starved; boats splintered and food spoiled or washed away."],["Separation Canyon","Near the end, exhausted and certain the next rapids were death, three men \u2014 William Dunn and the brothers Oramel and Seneca Howland \u2014 left the expedition at Separation Canyon (Mile 240) to climb out. They were never seen again, killed on the plateau above. Powell and the rest ran the rapids and reached safety two days later. The place still bears their leaving."],["The second expedition, and the name","Powell returned in 1871\u201372 with a photographer and topographers, producing the first accurate maps and much of the canyon\u2019s naming \u2014 it was Powell who popularized \u2018Grand Canyon.\u2019 He went on to found the U.S. Geological Survey and to warn, presciently, that the arid West held far less water than settlers hoped."],["Powell\u2019s later years","Powell went on to direct both the U.S. Geological Survey and the Smithsonian\u2019s Bureau of Ethnology, channeling his canyon fame into decades of federal science and the documentation of Native American languages and cultures. He died in 1902; the canyon's main visitor viewpoint and a national forest bear his name today."]],dams:[["Prospectors and the trails","In the 1880s and 90s, prospectors chased copper, silver, lead, and asbestos into the canyon, blasting and improving trails \u2014 many following ancient Indigenous routes. The Bright Angel Trail began as a Havasupai path widened by miners. Almost none of the claims paid."],["Mining the tourists","The ore was mostly too poor and too remote to profit, and men like John Hance, William Bass, Seth Tanner, and Louis Boucher (\u2018the Hermit\u2019) soon found that guiding and lodging visitors paid far better than digging \u2014 becoming the canyon\u2019s first tourism entrepreneurs. Ralph Cameron ran the Bright Angel Trail as a private toll road and battled the Park Service for years."],["The Orphan Mine and the guano folly","Uranium was pulled from the Orphan Mine on the South Rim into the 1960s, inside the park boundary. Across the western canyon, a company strung a mile-long aerial tramway in the 1950s to mine bat guano for fertilizer \u2014 a costly fiasco that ended after an Air Force jet clipped the cable."],["Glen Canyon Dam changes the river","Completed just upstream in 1963, Glen Canyon Dam transformed the Colorado. The once-warm, silt-red, seasonally flooding river became cold, clear, and controlled, released from the bottom of Lake Powell. Native fish declined, sediment-starved beaches shrank, and the river you\u2019ll run is, in a real sense, now a managed machine."],["The dams that almost drowned the canyon","In the 1960s the Bureau of Reclamation proposed two more dams inside Grand Canyon itself \u2014 Marble Canyon Dam near Mile 39 and Bridge Canyon Dam in the west \u2014 to make power for the Central Arizona Project. Their reservoirs would have flooded long reaches of the river corridor you\u2019re about to travel."],["\u2018Should we also flood the Sistine Chapel?\u2019","The Sierra Club, led by David Brower, fought back with full-page newspaper ads in 1966. To the claim that a reservoir would let tourists motor closer to the walls, one ad replied: \u2018Should we also flood the Sistine Chapel so tourists can float nearer the ceiling?\u2019 The IRS stripped the Club\u2019s tax-exempt status the very next day \u2014 which only multiplied the public outrage."],["The canyon saved, 1968","Opposition was overwhelming. In 1968 Congress removed both Grand Canyon dams from the Central Arizona Project. It became one of the defining victories of the American environmental movement \u2014 the moment the country decided some places are worth more wild than dammed."],["Protecting the river, 1979 and 1992","The Grand Canyon became a UNESCO World Heritage Site in 1979. The Grand Canyon Protection Act of 1992 then required Glen Canyon Dam to be operated to protect downstream resources, leading to experimental \u2018high-flow\u2019 releases (from 1996 on) that deliberately flood the canyon to rebuild its sandbars and beaches \u2014 the very camps you\u2019ll sleep on."]],lore:[["Galloway turns the boats around","In the 1890s, Utah trapper Nathaniel Galloway remade whitewater. Instead of rowing blindly forward, he faced downstream and pulled against the current to slow and steer \u2014 the \u2018Galloway position\u2019 that essentially every oarsman on the river still uses today."],["The Kolb brothers\u2019 movie, 1911","Emery and Ellsworth Kolb, photographers whose studio clung to the South Rim, ran the river in 1911\u201312 hauling a movie camera. Their film \u2014 one of the first motion pictures of the canyon \u2014 played in their studio for decades; Emery narrated it in person until he died in 1976."],["Bessie and Glen Hyde, 1928","Honeymooners Glen and Bessie Hyde set out to run the canyon in a homemade wooden scow, Bessie hoping to become the first woman to do so. They vanished. Their boat was found weeks later, upright and fully loaded, gear untouched \u2014 but the couple was never found. It remains the canyon\u2019s most enduring mystery."],["The first women through, 1938","Botanists Elzada Clover and Lois Jotter ran the entire canyon in 1938 with boatman Norman Nevills, becoming the first women known to complete the trip \u2014 cataloguing its plants along the way. Nevills went on to launch the canyon\u2019s first commercial river trips."],["Buzz Holmstrom, solo","In 1937 Buzz Holmstrom, a quiet Oregon gas-station attendant, ran the whole Colorado through the Grand Canyon alone, in a boat he built himself \u2014 the first known solo descent. Of the river itself, he wrote, \u2018I have already had my reward.\u2019"],["Georgie, Woman of the River","Georgie White Clark democratized the canyon. In the 1950s she lashed war-surplus pontoons into giant motorized \u2018G-rigs\u2019 that carried many passengers cheaply, and she ran trips into her 80s. Loud, fearless, and beloved, \u2018Georgie\u2019 put the river within reach of ordinary people."],["Litton\u2019s dories and the fight for the canyon","Martin Litton brought elegant, hard-hulled wooden dories to the Grand Canyon and never stopped fighting for it, a fierce voice against the dams. His dories \u2014 and their tradition of rowing rather than motoring \u2014 still run the river today."],["The groover, and other traditions","River culture has its own lore. Rapids carry names from Powell and those after him \u2014 Sockdolager, Hance, Lava Falls \u2014 or from later runners, like Crystal, which grew monstrous after a 1966 flash flood. Even \u2018the groover\u2019 is history: named for the surplus ammo cans early boaters sat on, which pressed grooves into the seat."]]},rules:[{name:"Permit & Trip Leader",rules:[{t:"River permit required",d:"A permit is required for all noncommercial travel from Lees Ferry to Diamond Creek. The Trip Leader (permittee) named on the permit \u2014 or an approved Potential Alternate Trip Leader \u2014 must accompany the entire trip."},{t:"Trip Leader is responsible for the party",d:"The Trip Leader must ensure every member follows these regulations plus all federal, state, local, and tribal laws. Violations can bring permit revocation, citations, and loss of future river access."},{t:"Carry the current regulations",d:"A copy of these regulations must be aboard and must be a current version \u2014 downloaded within 2 months of launch."},{t:"Participant list & photo ID",d:"Everyone must be on the Participant List turned in at Lees Ferry and carry valid government photo ID with date of birth (driver license, state ID, or passport). No ID, no trip \u2014 except children 15 and under. Credit cards and birth certificates don\u2019t count."},{t:"One trip per calendar year",d:"No one may take more than one river trip (commercial or noncommercial) per calendar year through any part of the Lees Ferry\u2013Diamond Creek section."},{t:"Keep documents accessible",d:"Rangers may travel or camp with the trip and can ask to see the permit, passenger list, and Lees Ferry checkout sheet, and inspect camp procedures. Keep them handy."}]},{name:"Trip Size & Travel",rules:[{t:"Max 16 (standard) or 8 (small)",d:"Total participants \u2014 including the Trip Leader \u2014 may never exceed the permitted group size at any point in the trip."},{t:"Travel & camp together, one beach",d:"People under one permit must travel and camp together on a single beach. You may split for a loop hike but must rejoin and camp together \u2014 and never split up to grab campsites ahead of other groups."},{t:"Motorized vs. non-motorized season",d:"Sept 16\u2013Mar 31 is non-motorized only \u2014 a launch in that window is oar/paddle power. Motor season is Apr 1\u2013Sep 15. A non-motor trip may stow a motor for use only below Separation Canyon, with a signed waiver \u2014 never above Separation."},{t:"No upstream travel above Separation",d:"No vessel may travel primarily upstream above Separation Canyon (RM 240)."}]},{name:"Launch & Checkout \u2014 Lees Ferry",rules:[{t:"Orientation & checkout: 3 PM the day before",d:"Everyone launching from Lees Ferry must attend the ranger orientation and checkout at 3:00 PM MST the day before launch (Arizona keeps no DST). Checkout is an inspection \u2014 expect gear to be opened to verify required equipment."},{t:"Check in before unloading",d:"The Trip Leader checks in with the ramp ranger before unloading. With no ranger and no instructions, rigging may begin at noon up to one day before launch. Morning rigging (8:00\u201310:30 AM) is reserved for trips leaving that day."},{t:"Vehicles & parking",d:"Two vehicles per group on the ramp, only to unload, then move to the day lot. Overnight parking goes in the extended / 14-day lot \u2014 never on the ramp or day lot."},{t:"River Runners Camp: one night, quiet hours",d:"The Private River Runners Camp is for the night before launch only (one-night limit, up to 16 people). Quiet hours 10 PM\u20136 AM MST. Carry out human waste and charcoal ash; no firewood gathering. After the trip, camp only in the Lees Ferry Campground."}]},{name:"Life Jackets & Safety Gear",rules:[{t:"PFDs \u2014 type & condition",d:"Each PFD must be USCG-approved for whitewater/rafting/kayaking, Type I, III, or V, in good condition \u2014 no holes, tears, or broken/repaired buckles or zippers, and no patches on the main body. General boating, fishing, and ski vests aren\u2019t allowed."},{t:"PFDs \u2014 quantity",d:"One per person, plus one spare per 10 people. Kayak/canoe trips add one spare per 4 boats."},{t:"Worn & fastened above Separation",d:"Everyone must wear a properly fastened PFD at all times on the river at Separation Canyon (RM 240) and above. Below Separation, only children 12 and under are required to wear one (AZ law)."},{t:"Throwable device",d:"Each boat 16 ft and longer must carry a USCG-approved throwable flotation device in serviceable condition."},{t:"Spare propulsion & repair",d:"Each oar boat carries a spare set of oars; each paddle raft two spare paddles; kayak/canoe trips one spare paddle per 4 boats. Carry an air pump (for inflatables) and a patch/repair kit for every boat material on the trip."},{t:"First aid, signaling & comms",d:"A first aid kit on every boat. Emergency signaling: a USAF-type signal mirror and two 3\xD78-ft international-orange panels that form an \u2018X\u2019 visible from aircraft. A satellite phone or ground-to-air radio is strongly recommended (not required)."}]},{name:"Fires & Stoves",rules:[{t:"Gas stove required",d:"Every trip carries a gas stove (propane, white gas, etc.) with enough fuel for cooking. Charcoal may be used for cooking; wood fires are for warmth or ambiance only."},{t:"Fire pan + fire blanket",d:"Wood/charcoal fires need a metal fire pan (\u2265 300 sq in, 3-in lip on all sides) elevated on manufactured legs, over a fire blanket (~60\xD772 in, or \u2265 20% larger than the pan/Dutch oven). Pan & blanket are required on all trips launching Nov 1\u2013end of Feb, and any time you burn wood or charcoal."},{t:"Driftwood \u2014 winter only",d:"Nov 1\u2013end of Feb you may burn beach driftwood; the rest of the year all wood must be packed in. Never pre-collect wood for later, and never gather from standing or fallen trees. Fires only on river-corridor beaches."},{t:"Carry out all ash",d:"All ash and fire residue must be carried out of the canyon."}]},{name:"Human Waste \u2014 Carry It Out",rules:[{t:"Carry out all solid waste + TP",d:"All solid human waste and toilet paper must leave the canyon. In camp use the washable, reusable, park-approved toilet; between camps and on day hikes use a wag-bag (PETT/Restop) system. Plastic \u2018Scat Packer\u2019 buckets are prohibited."},{t:"Pack out feces from side hikes",d:"When hiking away from camp, bag all feces and carry it back to camp. Put toilet paper in the main toilet \u2014 never burn it."},{t:"Urine",d:"Urinate directly into the Colorado in the main corridor, or into your toilet. At night use the trip\u2019s pee bucket and pour it into the river in the morning. Away from the river, go \u2018high and far\u2019 \u2014 at least 100 ft from trails, camps, and side streams."}]},{name:"Trash & Soap",rules:[{t:"Pack out all trash",d:"Cans, rubbish, and refuse may never be left in the water, on shore, or in side canyons \u2014 carry it all out. No trash deposits at Phantom Ranch, Diamond Creek, Pearce Ferry, or South Cove. Strain liquid garbage through fine mesh; crush cans on a tarp or below the high-water line."},{t:"Kitchen tarps",d:"Place tarps under food prep, serving tables, and the dishwashing station to keep food scraps off the beach."},{t:"Soap only in the mainstem",d:"Use soap only in the main Colorado, never in side streams or within 100 yards of a side-stream junction. Solar showers must be used standing in the main flow."}]},{name:"Food Safety & Water",rules:[{t:"Handwashing & clean surfaces",d:"Wash hands after the toilet and after handling raw meat before touching other food. Sanitize prep surfaces and utensils with a 100\u2013200 ppm chlorine solution; keep raw-meat gear separate until cleaned."},{t:"Cooking & holding temps",d:"Cook meat and poultry to 165\xB0F. Keep cold foods below 45\xB0F and hot foods above 140\xB0F. Reheat leftovers to 165\xB0F (best saved for emergencies)."},{t:"4-bucket dish system",d:"Wash below the high-water line: pre-wash, wash (120\u2013140\xB0F soapy), dip-rinse, then sanitize 60 seconds in a 50\u2013100 ppm chlorine bath; air-dry on a rack."},{t:"Purify all water",d:"Treat all drinking and cooking water: a rolling boil for 1 minute, or filter to \u2264 0.2 microns plus a disinfectant (\u2248 2 drops chlorine per gallon). Settle muddy water overnight or with alum (1 tsp per 5 gal) and decant before treating. Draw from the mainstem unless it\u2019s very silty."},{t:"Report GI illness",d:"Any gastrointestinal illness must be logged on the Confidential Illness Report Form. If 3+ people fall ill, notify NPS Dispatch (928-638-7805) within 24 hours by sat phone."}]},{name:"Camping, Trails & Closures",rules:[{t:"Camp within 100 yards of water",d:"Set camp on resilient post-dam sandbars within 100 yards of the water line. Don\u2019t trample vegetation or blaze new routes or sleeping areas in the fragile desert zone. Stay on established trails and avoid shortcutting."},{t:"No-camp & day-use reaches",d:"No camping at: Paria confluence\u2013Navajo Bridge (RM 0.8\u20134.5), Little Colorado confluence area (RM 60.9\u201365.5), within 100 yds of Shinumo (RM 109.2), within \xBC mi of Elves Chasm (RM 117.2), Deer Creek (RM 136.6\u2013137.4), and Havasu (RM 157.2\u2013157.8). Day-use only (no camping): Tapeats (RM 134.3), Kanab (RM 144), Matkatamiba (RM 148.4). Redwall Cavern (RM 33.3): no camping and no fires."},{t:"Phantom exchange zone",d:"From RM 77.5 (below Hance) to RM 89.8 (below Pipe Creek), Mar 1\u2013Oct 31 these are Phantom Exchange Camps (exchange trips only) with no layovers. Outside those dates (Nov 1\u2013Feb 28/29) trips have more latitude, but there\u2019s no camping right around Phantom Ranch except the Pipe Creek camp (RM 89.2) or emergencies approved by the Phantom ranger."},{t:"Nankoweap special use (RM 52.5\u201353.5)",d:"Camping is limited to the three marked camps (First, Main, Lower), one party each. Hikers must disembark only at those camps or the mouth of Nankoweap Creek."},{t:"Closed sites",d:"No entry: Anasazi Bridge (RM 43.3), Hopi Salt Mines (RM 63.5\u201365), Furnace Flats (RM 71.5\u201372.2), Hance & Bass mines (asbestos), Bat Cave (RM 266.8), Rampart Cave (RM 274.5). No camping within 300 yds of Columbine Falls (RM 274.9)."},{t:"Tribal lands",d:"River-left above the historic high-water line from RM 165\u2013274 is Hualapai Tribal Land \u2014 camping or hiking there needs Hualapai approval. Hiking up Havasu past the Beaver Creek confluence requires Havasupai fees/permits."}]},{name:"Wildlife, Resources & Pets",rules:[{t:"Leave everything in place",d:"Don\u2019t remove or disturb rocks, fossils, plants, mining artifacts, or Indigenous artifacts (36 CFR 2.1)."},{t:"No pets",d:"No cats, dogs, or other pets on the trip."},{t:"Generators & night lights",d:"Generators only for emergencies and inflating rafts \u2014 not for lights, appliances, or sound. Boats running at night must show USCG running lights."}]},{name:"Clean, Drain, Dry",rules:[{t:"Decontaminate gear",d:"Quagga mussels are present in the river and Lake Mead. Clean, Drain, and Dry all boats and gear at the trip\u2019s end and before launching on any new water, then wait at least 5 days before entering another waterway."}]},{name:"Emergencies & Reporting",rules:[{t:"Helicopter evac is NPS-only",d:"Only the NPS arranges helicopter evacuations, and only for medical emergencies. Evacuation costs are the patient\u2019s responsibility."},{t:"How to call for help",d:"Emergency number: (928) 638-7911. By radio, give your LOCATION (river mile), then CRITICAL or STABLE, TRAUMA or MEDICAL, and PRIVATE or COMMERCIAL trip. A sat phone is most reliable; a signal-mirror flash is often the best way to reach aircraft."},{t:"Landing zone",d:"Pick a level ~15\xD715-ft spot clear of obstacles for 75 ft; set the orange \u2018X\u2019 near (not on) it; gather everyone 100+ ft away with loose gear secured; wet the pad down; never approach the helicopter unless the crew signals, and never from the rear."},{t:"Incident reports",d:"Report any evacuation, injury needing more than first aid, death or disappearance, or property damage over $500. File the Incident Report Form within 7 days (or within 24 hours if another agency ran a serious/hospitalization evac). Carry the forms on the trip."}]},{name:"Takeout & Fees",rules:[{t:"Pearce Ferry takeout",d:"The Pearce Ferry ramp is take-out only \u2014 no launching, swimming, camping, or shoreline fires. Keep the ramp clear and de-rig in the spaces up- or down-stream. Scout Pearce Ferry Rapid (\xBD mile below the South Cove option), which many rate the hardest in the canyon, before deciding to run it."},{t:"Fees",d:"River recreation fees are paid online before the permit issues. Diamond Creek takeouts owe additional Hualapai Tribe fees (per person, boat, and vehicle), arranged in advance."}]},{name:"Etiquette",rules:[{t:"Leave No Trace: walk only on durable surf
