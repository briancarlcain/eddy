aces",d:"Stay on rock, established trails, sandbars, and streambeds \u2014 never on undisturbed desert. That dark, knobby crust between the plants is cryptobiotic soil: a living skin of moss, lichen, and bacteria that holds the sand together and feeds the desert. A single boot print can take decades to heal, so rock-hop, follow washes, and walk single-file on trails that already exist."},{t:"Pee in the river, not on the beach",d:"Dilution is the solution \u2014 urinate into the wet sand at the water\u2019s edge or straight into the current. Urine left on dry sand and rock concentrates as it evaporates, reeks in the sun, and draws animals to dig at the salt. At night use the trip pee bucket and empty it into the river in the morning."},{t:"Never pee in the groover",d:"The groover is for solid waste only. Urine turns it into a heavy, sloshing, foul mess that\u2019s miserable to haul and to clean at the takeout. Keep the two separate \u2014 river or pee bucket for liquid, every time."},{t:"Leave what you find",d:"Potsherds, ruins, rock art, fossils, and wildflowers all stay exactly where they are \u2014 for the law (36 CFR) and for the next boat down. Take photos, stack no cairns, build nothing, and leave every camp looking wild."},{t:"Keep it quiet and share the canyon",d:"Sound carries for miles off the walls. Keep voices and music low, especially after dark; give other groups room at camps and attractions; and let the river\u2019s own soundtrack be the loudest thing most of the time."}]},{name:"Efficiency",rules:[{t:"Ride the tailwaves out of rapids",d:"The fastest water runs down the tongue and through the tailwaves in the main channel. Punch through and stay center rather than drifting to the edges \u2014 catch an eddy and you\u2019ll spin, stall, and burn real time and muscle rowing back out into the current."},{t:"Fireline the boats before tents go up",d:"When the whole group forms a line and passes every bag ashore \u2014 personal and group gear alike \u2014 before anyone pitches a tent, camp sets up dramatically faster. No boat sits half-unloaded, and the kitchen crew can start while others make camp."},{t:"Stage the fire, but hold the match",d:"Build the fire pan and lay the fire ready to go, then wait. If it\u2019s warm, still light out, bug-free, and folks haven\u2019t gathered around yet, you may not need one at all \u2014 saving wood, ash to pack out, and the whole burn-down at the end of the night."},{t:"Know the \u2018tides\u2019 and ride the high water",d:"The river isn\u2019t tidal \u2014 it rises and falls each day as Glen Canyon Dam ramps its releases (hydropeaking). Higher flows give more push and bury rocks; low water is slower and bonier. Time big-mileage days and rocky, technical stretches for the higher, faster water when you can."},{t:"Know the dinner plan; pull only what you\u2019ll use",d:"Keep each night\u2019s menu in mind so you unload only the food and gear you\u2019ll actually use that evening instead of excavating and re-stowing the whole boat. Camp goes faster, the beach stays tidy, and the coolers stay cold and packed."}]}],landmarks:[{name:"Glen Canyon Dam",mile:-15,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Lees Ferry Boat Ramp",mile:0,civ:!0,diff:null,tier:"Landmark",desc:"Mile 0 \u2014 the launch point for virtually every Grand Canyon river trip. The journey downstream begins here."},{name:"Paria River Confluence",mile:.9,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Navajo Bridges",mile:4.5,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Tenmile Rock",mile:10.2,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Boulder Narrows",mile:18.7,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Large Caves",mile:25.2,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Fence Fault Spring Complex - Water Refill",mile:30.5,civ:!1,diff:null,tier:"Landmark",desc:"Water refill point."},{name:"South Canyon",mile:31.8,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Vasey's Paradise - Water Refill",mile:32.2,civ:!1,diff:null,tier:"Landmark",desc:"Water refill point."},{name:"Redwall Cavern Dam Site",mile:33.2,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Redwall Cavern",mile:33.3,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Bridge of Sighs",mile:36,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Marble Canyon Dam Site",mile:39.7,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Anasazi Bridge",mile:43.3,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Nankoweap Mesa",mile:51,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Butte Fault",mile:65.7,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Puebloan Granary",mile:73.8,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Upper Granite Gorge",mile:77.9,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Kaibab Bridge",mile:88,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Phantom Ranch - Water Refill",mile:88.1,civ:!0,diff:null,tier:"Landmark",desc:"The only developed outpost deep in the canyon, at the foot of the Bright Angel and South Kaibab trails \u2014 a vital water and refill stop."},{name:"Pipe Creek Confluence",mile:89.5,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Tower of Set",mile:91.6,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Point Sublime",mile:97,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Powell Plateau",mile:107.7,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Conquistador Aisle",mile:120,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Middle Granite Gorge",mile:126.3,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Randy's Rock",mile:127.04,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"130.7 Mile Waterfall",mile:130.7,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Granite Narrows",mile:135.6,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Muav Gorge",mile:140.5,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Mount Sinyella",mile:153,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Red Slide",mile:175.5,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Whitmore Helipad",mile:187.4,civ:!0,diff:null,tier:"Landmark",desc:""},{name:"Pumpkin Spring",mile:213.21,civ:!1,diff:null,tier:"Landmark",desc:"Orange travertine dome bubbling a mineral spring at the water; photogenic but arsenic-laden - don't drink/soak."},{name:"Lower Granite Gorge",mile:217.4,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Diamond Creek Boat Ramp",mile:225.9,civ:!0,diff:null,tier:"Landmark",desc:"The only road-accessible point on the river inside the canyon (on Hualapai land) \u2014 a very common take-out."},{name:"Sandbar Alley",mile:254,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Grand Wash Cliffs",mile:277.1,civ:!1,diff:null,tier:"Landmark",desc:""},{name:"Pearce Ferry Boat Ramp",mile:280.5,civ:!0,diff:null,tier:"Landmark",desc:"The final take-out, where the moving river gives way to the still water of Lake Mead."}],clusters:[{s:20.7,e:30,n:"Roaring 20s"},{s:98,e:107,n:"The Gems"}],notes:{camp:"*SAFETY: Many campsites are in or near side canyons. Be cognizant of rising river levels and camp high.",hike:`*Many hikes also have arbitrary turnaround points and can be made shorter or longer than this estimate says
**SAFETY: Many hikes are in flash-flood-prone canyons that drain large areas of desert. Creek crossings can also be made more difficult with running water.`},hdiff:{"1":"Established hiking trail","2":"Rugged trail","3":"Expect some Route-finding & Scrambling","4":"Route-finding & Scrambling, potentially with exposure","5":"4th & low 5th class moves"},access:[{name:"Flagstaff",road:!0,hub:!0,note:"Where the cars wait out the trip",grid:[6,2]},{name:"Lees Ferry",road:!0,mile:0,park:!0,grid:[0,6]},{name:"South Rim",road:!0,toMile:88.2,trail:"Bright Angel / South Kaibab",hike:"9.5 mi, ~6 hr down",park:!0,grid:[4,4]},{name:"North Rim",road:!0,toMile:88.1,trail:"North Kaibab",hike:"14 mi, closed mid-Oct to mid-May",park:!0,grid:[2,3]},{name:"Phantom Ranch",mile:88.1,note:"Foot access only \u2014 rim trails",grid:[3,6]},{name:"Whitmore Wash",road:!0,mile:187.9,note:"4WD / helicopter exchange",grid:[7,6]},{name:"Diamond Creek",road:!0,mile:225.9,park:!1,note:"Hualapai permit; no overnight parking",grid:[9,6]},{name:"Pearce Ferry",road:!0,mile:280.5,park:!0,grid:[11,6]}],yardGrid:[7,1],roads:[{a:"Flagstaff",b:"Lees Ferry",h:2.25},{a:"Flagstaff",b:"South Rim",h:1.5},{a:"Lees Ferry",b:"North Rim",h:2},{a:"Flagstaff",b:"Diamond Creek",h:2.75},{a:"Flagstaff",b:"Pearce Ferry",h:3.75},{a:"Outfitter",b:"Flagstaff",h:""},{a:"South Rim",b:"Phoenix",h:3.5}]};var H0={name:"Smith River",reach:"Camp Baker to Eagle Creek",agency:"Montana FWP / Lewis & Clark National Forest",miles:[0,59],days:4,coords:[46.89,-111.17],tz:"America/Denver",note:"Starter record: reach, mileage and put-in/take-out only (coordinates approximate). Permits are by lottery through Montana FWP. Add rapids, camps and hikes from your guidebook with the editor on the Rivers tab, or import a river JSON.",access:[{name:"Great Falls",road:!0,hub:!0,note:"Nearest city / airport; shuttle base"},{name:"Camp Baker",road:!0,mile:0,park:!0,note:"Put-in"},{name:"Eagle Creek",road:!0,mile:59,park:!0,note:"Take-out"}]};var F0={name:"Rogue River",reach:"Grave Creek to Foster Bar",agency:"BLM Medford District / Rogue River-Siskiyou National Forest",miles:[0,34],days:4,coords:[42.64,-123.6],tz:"America/Los_Angeles",note:"Starter record: reach, mileage (from Grave Creek) and put-in/take-out only (coordinates approximate). Wild section floats require a BLM permit in the summer season. Add rapids, camps and lodges from your guidebook with the editor on the Rivers tab, or import a river JSON.",access:[{name:"Grants Pass",road:!0,hub:!0,note:"Nearest city; shuttle base"},{name:"Grave Creek",road:!0,mile:0,park:!0,note:"Put-in"},{name:"Foster Bar",road:!0,mile:34,park:!0,note:"Take-out"}]};var Ii="grand-canyon",sa={"grand-canyon":{id:"grand-canyon",days:19,...G0},smith:{id:"smith",...H0},rogue:{id:"rogue",...F0}};function cl(e){let t=Array.isArray(e.miles)&&e.miles.length===2?e.miles.map(Number):[0,1],a=Array.isArray(e.coords)&&e.coords.length===2?e.coords.map(Number):[39.5,-105];return{name:"Untitled river",reach:"",agency:"",note:"",tz:"America/Denver",camps:[],rapids:[],hikes:[],geology:[],guide:[],rules:[],landmarks:[],clusters:[],access:[],roads:[],...e,miles:t[1]>t[0]?t:[0,Math.max(1,t[0]+1)],coords:a,almanac:e.almanac||{},notes:{camp:"",hike:"",...e.notes||{}},hdiff:e.hdiff||{}}}var $i={medical:[{name:"Life-Threatening Emergencies",conditions:[{title:"Cardiac Arrest",evac:4,recognize:["Unresponsive","Not breathing normally, or no breathing","No pulse"],treat:["Confirm scene safety and unresponsiveness","Begin CPR immediately \u2014 30 compressions : 2 breaths, 100\u2013120/min, full recoil","Attach the AED as soon as it arrives and follow its voice prompts","Continue CPR until the AED advises otherwise, rescuers are exhausted, or the patient is handed off to more advanced care","If the patient is hypothermic, extend pulse checks to 60 seconds and keep resuscitating \u2014 see Cold Exposure"]},{title:"Severe / Life-Threatening Bleeding",evac:4,recognize:["Spurting or steady heavy blood loss","Blood pooling faster than it can be absorbed"],treat:["Apply firm direct pressure with gauze; add more gauze on top if it soaks through, don't remove the first layer","If on a limb and direct pressure fails, apply a tourniquet 2\u20133 in above the wound (never on a joint); tighten until bleeding stops and note the time","Do not loosen a tourniquet once applied in the field","For deep wounds on the torso or junctional areas (groin/armpit) where a tourniquet can't be used, pack the wound with gauze and hold direct pressure"]},{title:"Anaphylaxis",evac:4,recognize:["Hives, swelling of face/lips/tongue, or widespread rash","Plus difficulty breathing, wheezing, throat tightness, or GI symptoms (vomiting, cramping)","Rapid onset after a sting, food, or medication"],treat:["Administer the epinephrine auto-injector into the outer thigh (can go through clothing); hold per the device's instructions","Position: lying flat with legs raised if dizzy/faint; sitting up if breathing is easier that way; recovery position if vomiting","May repeat a second dose after 5\u201315 minutes if there's no improvement and one is available","Antihistamine and inhaler are useful adjuncts but do not replace epinephrine","Evacuate even if symptoms fully resolve \u2014 a second wave (biphasic reaction) can follow hours later"]},{title:"Drowning / Near-Drowning",evac:4,recognize:["Submersion, panicked or silent struggling swimmer","Coughing, foam at the mouth, or altered mental status after a swim/flip"],treat:["Reach or throw before you go \u2014 don't become a second victim in the current","If not breathing, begin rescue breaths / CPR immediately, even before the patient is fully out of the water if it's safe to do so","Any submersion with coughing, altered mental status, or breathing trouble needs evaluation \u2014 delayed pulmonary edema can develop hours later even after an apparent full recovery"]},{title:"Suspected Spinal Injury",evac:4,recognize:["Significant mechanism \u2014 fall, high-speed flip, hard hit against rock or gear","Neck/back pain, numbness, tingling, weakness, or altered mental status"],treat:["Minimize movement; manually stabilize the head and neck in the position found","Do not move the patient unless there is immediate danger (fire, rising water, rockfall)","Assess and monitor circulation/sensation/motion in all four limbs"]}]},{name:"Fractures, Dislocations & Sprains",conditions:[{title:"Long Bone Fracture (Closed)",evac:3,recognize:["Deformity, swelling, point tenderness","Inability to bear weight or use the limb"],treat:["Check circulation, sensation, and motion (CSM) distal to the injury before splinting","Splint in the position found using a SAM splint; immobilize the joints above and below the fracture","Recheck CSM after splinting","Ice and elevate if possible"]},{title:"Open / Compound Fracture",evac:4,recognize:["Bone visible, or a wound directly over a suspected fracture"],treat:["Control bleeding with direct pressure first","Do not push the bone back in","If evacuation will be delayed more than ~6 hours, gently irrigate the wound with clean water","Cover with a sterile dressing, then splint without putting pressure on the wound","Treat as high infection risk \u2014 this is the highest-priority fracture type"]},{title:"Joint Dislocation",evac:3,recognize:["Visible deformity at a joint, severe pain, loss of function"],treat:["Check CSM distal to the injury","Splint in the position found","Do not attempt to force it back into place unless a WFR-trained responder judges CSM is compromised and a specific reduction technique applies"]},{title:"Sprains & Strains",evac:2,recognize:["Pain, swelling, bruising around a joint","Some stability and weight-bearing usually still possible"],treat:["RICE \u2014 Rest, Ice (or cold river water), Compression wrap, Elevation","NSAID for pain/swelling per package directions","Reassess ability to bear weight before resuming activity; escalate if not improving in 24\u201348 hours"]}]},{name:"Wounds, Burns & Skin",conditions:[{title:"Minor Cuts & Scrapes",evac:1,recognize:["Shallow wound, controlled bleeding"],treat:["Irrigate thoroughly with clean water, remove debris","Antibiotic ointment, cover with a bandage","Change daily; watch for infection \u2014 increasing redness, warmth, pus, red streaking, fever"]},{title:"Deep Lacerations",evac:2,recognize:["Wound edges gape open, may extend into fat or muscle"],treat:["Control bleeding with direct pressure; irrigate thoroughly","If clean and under ~6\u201312 hours old, approximate the edges with wound-closure strips","Cover and monitor closely; evacuate if it can't be closed cleanly, crosses a joint, or shows infection signs"]},{title:"Blisters",evac:1,recognize:["Friction-related fluid pocket under the skin"],treat:["Clean the area; leave intact if possible","If painful or likely to tear, drain with a sterilized needle and leave the roof of skin in place","Cover with moleskin or a blister pad"]},{title:"Burns",evac:2,recognize:["Sun, stove/fire, or scald exposure","Redness, blistering, or (severe) white/charred/leathery skin"],treat:["Cool immediately with water for 10+ minutes; do not apply ice directly to the burn","Cover with a sterile non-stick dressing; do not pop blisters","NSAID for pain","Evacuate urgently if the burn is large, on the face/hands/genitals/joints, full-thickness, or wraps around a limb"]}]},{name:"Skin, Sun & Foot Care",conditions:[{title:"Sunburn",evac:1,recognize:["Red, hot, tender skin; tight feeling; blistering and chills when severe","Reflected glare off the water burns the spots people forget \u2014 under the chin and nose, backs of the hands, ears, and lips"],prevent:["Broad-spectrum SPF 30+ reapplied every 2 hours and after every swim; don't skip ears, tops of feet, and the underside of the chin","Sun hoodie, wide-brim hat, UPF long sleeves, and sun gloves do more than lotion ever will \u2014 cover up","Zinc oxide on nose, lips, and ears; sunglasses to protect the eyes off the water glare","Take the midday break in shade when you can"],treat:["Cool the skin with water or cool wet compresses","Aloe or a plain moisturizer; rehydrate; NSAID for pain","Leave blisters intact; keep burned skin out of the sun and covered"],note:"Widespread blistering, fever, or a burn on a child \u2014 treat as a burn and monitor (see Wounds, Burns & Skin)."},{title:"Chafing",evac:1,recognize:["Raw, stinging, reddened skin where skin or wet fabric rubs \u2014 inner thighs, groin, underarms, waistband, PFD edges, and bra lines","Salt, sand, and constant damp make it worse fast"],prevent:["Anti-chafe balm or petroleum jelly on friction zones before the day starts","Snug synthetic or wool base layers \u2014 no cotton; make sure the PFD and shorts actually fit","Rinse salt and grit off the skin and let seams dry"],treat:["Clean and dry the area","Barrier ointment (zinc oxide / diaper cream) or antibiotic ointment","Air it out at camp; pad the spot before the next day"],note:"If broken skin becomes redder, warm, or starts weeping pus, treat as an infection and watch it."},{title:"Heat Rash & Skin Rashes",evac:1,recognize:["Prickly rash or tiny bumps in sweaty, covered areas (heat rash / prickly heat)","Itchy red patches from plant contact or a new product (contact dermatitis)"],prevent:["Loose, breathable layers; keep skin as dry as conditions allow","Rinse sweat and sunscreen off at day's end","Don't brush bare skin against unfamiliar plants"],treat:["Cool, dry, and air out the area","Hydrocortisone cream for itch; antihistamine if it's widespread and itchy; calamine helps","Don't scratch \u2014 broken skin invites infection"],note:"A spreading rash with fever or blistering, or any facial/throat swelling with breathing trouble, is not a simple rash \u2014 see Life-Threatening Emergencies."},{title:"Dry & Cracked Hands",evac:1,recognize:["Tight, rough, splitting skin on knuckles, fingertips, and cuticles from sun, wind, sand, and endless wet-dry cycles","Deep cracks (fissures) at the fingertips that snag, sting, and bleed"],prevent:["Heavy hand balm morning and night and after every wash \u2014 this is the whole game","Gloves for rigging and rope work; go easy on harsh soap and hand sanitizer","A thick coat of balm under gloves or socks overnight lets hands recover"],treat:["Wash, dry, then seal with a thick occlusive balm (petroleum jelly / Aquaphor), heaviest at bedtime","For a deep painful crack, clean it and close it with liquid bandage / skin glue, or tape over ointment","Cover any split that could pick up dirt"]},{title:"Wet Feet & Immersion Foot",evac:2,recognize:["Pale, wrinkled, soft (macerated) skin from feet living in wet neoprene all day; tender, itchy, prone to cracking","Athlete's foot \u2014 itchy, peeling, cracked skin between the toes","Immersion (\u201Ctrench\u201D) foot in prolonged cases: numb, cold, blotchy feet that become painful and swollen on rewarming"],prevent:["Dry the feet out every chance \u2014 bare feet in camp, air and sun them at every stop","Keep one dry pair of socks and camp shoes/sandals reserved for evenings only","Foot or antifungal powder daily; rinse grit; rotate and dry booties and socks; keep toenails trimmed"],treat:["Get feet clean, dry, and warm; elevate them at camp","Antifungal cream or powder for athlete's foot; barrier cream on macerated skin","Treat cracks and blisters as wounds \u2014 clean, protect, watch for infection"],note:"Immersion foot with persistent numbness, swelling, or spreading redness/pus needs to be monitored closely and evacuated if it worsens."},{title:"Chapped Lips",evac:1,recognize:["Dry, cracked, peeling, sometimes bleeding lips from sun and wind"],prevent:["SPF lip balm, reapplied often; hat brim for shade; stay hydrated"],treat:["Occlusive lip balm; stop licking the lips (it makes it worse); let cracks heal under balm"]}]},{name:"Head & Neurological",conditions:[{title:"Concussion / Head Injury",evac:2,recognize:["Mechanism to the head, plus any of: confusion, headache, dizziness, nausea, memory gaps, any loss of consciousness (even brief)"],treat:["Rest; recheck neuro status frequently over the next 24 hours \u2014 this is the key task","Use acetaminophen rather than NSAIDs for pain (avoids masking a bleed)","Avoid re-injury"],note:"Evacuate immediately for any: loss of consciousness, worsening confusion, unequal pupils, repeated vomiting, or seizure."}]},{name:"Cold Exposure",conditions:[{title:"Hypothermia \u2014 Mild",evac:2,recognize:["Shivering, alert, mild confusion, cold to the touch"],treat:["Remove wet clothing, insulate with dry layers and a sleeping bag","Warm sweet drinks if fully alert","Light activity to generate heat; shelter from wind"]},{title:"Hypothermia \u2014 Moderate / Severe",evac:4,recognize:["Shivering stops","Confusion, lethargy, slurred speech, loss of coordination","Severe: unresponsive, weak or absent pulse"],treat:["Handle gently \u2014 rough movement can trigger a fatal arrhythmia","Remove wet clothing (cut it off rather than moving the limbs if needed)","Insulate fully, including the head; active rewarming with warm packs at the neck, armpits, and groin","Do not give food or fluids unless fully alert; do not massage the extremities","If no pulse is found after a full 60-second check, begin CPR and continue \u2014 hypothermic patients can survive prolonged arrest: not dead until warm and dead"]},{title:"Frostnip / Frostbite",evac:3,recognize:["Numbness, white or waxy skin","Frostbite: tissue is hard/wooden \u2014 actually frozen"],treat:["Frostnip: rewarm with body heat","Frostbite: do NOT rewarm if there's any chance of refreezing \u2014 refreezing causes far worse damage than staying frozen","If refreezing can be prevented, rewarm only in a stable warm water bath; expect severe pain on rewarming and protect the area afterward"]}]},{name:"Heat Exposure",conditions:[{title:"Heat Exhaustion",evac:2,recognize:["Heavy sweating, weakness, nausea, headache, dizziness","Mental status close to normal"],treat:["Move to shade, remove excess clothing","Cool with water and fanning","Rehydrate with water plus electrolytes; rest","Evacuate if not improving within 30\u201360 minutes"]},{title:"Heat Stroke",evac:4,recognize:["Altered mental status \u2014 confusion, combativeness, or unconsciousness \u2014 combined with feeling hot","May or may not still be sweating"],treat:["Aggressive cooling is the priority \u2014 immerse in river water if it can be done safely, or wet the skin and fan","Ice packs at the neck, armpits, and groin","Treat as a true emergency"]},{title:"Dehydration",evac:1,recognize:["Thirst, dark urine, fatigue, headache, dizziness"],treat:["Oral rehydration with water plus electrolytes","Monitor urine color and output"]}]},{name:"GI Illness & Hangover",conditions:[{title:"Gastrointestinal Illness",evac:2,recognize:["Nausea, vomiting, diarrhea, cramping, possibly fever"],treat:["Aggressive oral rehydration with water plus electrolytes; rest; bland food as tolerated","An anti-diarrheal can be used for symptom control if there's no high fever or blood in the stool","Strict hand hygiene and separate personal eating/drinking gear \u2014 this spreads fast through a shared kitchen","Evacuate if fluids can't be kept down for 24+ hours, dehydration is severe, or there's high fever or blood in stool/vomit"]},{title:"Hangover",evac:1,recognize:["Headache, nausea, fatigue, dehydration after alcohol use"],treat:["Rehydrate with water plus electrolytes","Acetaminophen or NSAID for headache (not both), bland food, rest, time","If symptoms are severe or don't fit the usual pattern, reconsider heat illness, dehydration, or GI illness instead"]}]},{name:"Bites, Stings & Envenomation",conditions:[{title:"Rattlesnake Bite",evac:4,recognize:["Puncture marks, immediate pain, swelling that spreads over time"],treat:["Keep the patient calm and still; immobilize the bitten limb below heart level","Remove jewelry and tight clothing before swelling progresses","Mark and time the leading edge of swelling on the skin if possible","Do NOT cut the wound, suck out venom, apply a tourniquet, or apply ice \u2014 all worsen outcomes and are outdated advice"]},{title:"Scorpion Sting",evac:2,recognize:["Sharp localized pain and swelling","Bark scorpion stings can cause systemic symptoms \u2014 numbness beyond the site, trouble breathing \u2014 especially in children"],treat:["Clean the site, cold pack, pain control","Monitor closely for systemic symptoms; evacuate urgently if they appear"]},{title:"Insect Sting (Bee / Wasp)",evac:1,recognize:["Localized pain, swelling, redness at the sting site"],treat:["Scrape out a stinger if present (don't pinch it \u2014 that injects more venom)","Cold pack, antihistamine, NSAID for pain","Watch for signs of anaphylaxis \u2014 see Life-Threatening Emergencies"]}]}],signals:[["1 whistle blast","Attention"],["3 whistle blasts","Emergency"],["Paddle/arm straight up","All clear, come ahead"],["Paddle/arm angled to one side","Move to that side \u2014 never point at the hazard"],["Paddle horizontal overhead","Stop"],["Waved side to side overhead","Emergency"],["Hand tapping top of head","Are you OK / I'm OK"]],rescue:[["Talk","Tell the swimmer where to go."],["Reach","Paddle, oar, branch, hand \u2014 from a stance you won't be pulled out of."],["Throw","Bag past and across the swimmer. Rope over the shoulder, never wrapped."],["Row","Bring a boat. Stern or line, not the oar blade."],["Go","In the water. Trained only."],["Tow","Tethered, quick-release harness. Trained only."]],swim:[["Feet downstream and up","Never stand in current above the knee."],["Strainer","Swim at it hard, head up, get on top of it."],["Hole","Downstream corners; if held, ball up and take the deep outflow."],["Cold","Do your self-rescue in the first minute. Hands stop working after ten."]],gear:{Boats:["Raft","Oars + 1 spare per boat","Frame + spare hardware","Pump \xD72","Cam straps","Bow/stern lines"],Safety:["PFD per person + 1 spare"," French Onion Soup?`},{title:"Questions for Ceiba (outfitter)",group:"Logistics",cols:["Question","Answer"],rows:[["How many compost cans will we need?","1-2"],["What time do they try to arrive at Lees Ferry for staging?","11am Arizona Time"],["How long does it take to get from Diamond Creek to Pearce Ferry?","2 days with a night float"],["Toilet, 50 uses per deposit box, right?","45 deposits"],["What's actually in the set of cook pots, silver bowls, and dutch ovens? Same with the Plates, Bowls, Silverware. Do you just provide enough for our whole group, whatever quantity that would be?","Ask Rachel"],["How many rafts fit on the trailer?","At least 4 so they'll only need one truck."],["Can we leave our cars at Lees Ferry until you're ready to shuttle them? Or do we need to pay to shuttle our cars from Lees Ferry to Flag, and then also pay to have our vehicles shuttled from Flag to South Rim/Diamond/Pearce?","Cars get shuttled back to Flag and stay there during the trip. Then Ceiba brings them to the takeout."],["When do the mules arrive?","Mules will arrive at Phantom Ranch by 6:30am"],["Why do you offer rice bags? Are they actual bags of rice?","No it's just a woven bag"],[`We like our blackstone + jet oil burners. Can we use that? We want to take advantage of their "system." If their kitchen supplies are part of that, great. If not, we'd prefer to use our own kitchen, tables, and fire pan. What exactly does the "rig" look like (eg is the raft frame specifically designed to have the kitchen and fire pan rigged in a very specific spot?)`,"No wouldn't throw things off at all"],["What does your fire pan look like? Should we bring our own?",""],["Does the full rig come with oar towers, but the adjustable oar towers are an additional cost? How does that work? Same thing with the oars; it looks like the oars come with the full rig, but they're also listed as available to rent for $11 per day",""],["What's going on with the price of kitchen items? Complete kitchen setup for 8-16 people is listed as $40 per day - what's included in that? Initial kitchen supplies: dishsoap, clorox, sponges, scrubbies, sparkies, hotpads, dish towels is listed as a flat fee of $50",""],["What size propane tanks? 20lbs?",""],[`Daytripper day time toilet says it's required by NPS; can we just use wag bags? Noncommercial River Trip Regulations explicitly make it seem like that's the case (pg 18) but also say "Please note that a washable reusable toilet container must be accessible during the day."`,""],[`What's going on with the toilet pricing? Is it all included in the toilet box thing? Next to the porto riser, it says included in Box. But then the Porto Box does not specify that it's included, yet the thing is called "Toilet system box"`,""],[`It says "Full trip toilet supplies included with food pack." Is that just extra toilet paper, cleaning supplies, gloves, etc.? That doesn't include the actual toilet or deposit boxes, right?`,""],["How expensive is the food pack? Is it a flat fee of $950? Is that the flat fee for the whole trip or are there extra fees if the trip is longer than 1 week? There were separate line items for $26 and $29 depending on the number of people involved Is the Ceiba food pack ($950) priced per trip or per person?",""],["What's at Peach Springs? Why do people shuttle there?",""],["I want to confirm the capacity of both the truck & trailer plus the capacity for the van. So the truck & trailer can fit 4 people. One of them will be the truck/trailer driver; other seats will be reserved for the number of shuttlers moving personal vehicles. Any remaining seats would be available for the rafters? What's the capacity of the van? Do other staff need to come? Or if we have one two people getting out at Diamond and we're dropping 2 boats (and they carpooled), would you just need to send the truck/trailer (driver + vehicle shuttler + 2 rafters)?",""],["Do you all split tips? When's the best time to tip, or should we tip at each boat ramp?",""],["Do you shuttle from Lees Ferry straight to South Rim or Peach Springs? Diamond and Pearce are the only ones where you'd go from Lees back to Flag, park for a while, and then shuttle Flag to Diamond/Pearce?",""],["The price is slightly less for the Whole Shebang vs. Parts & Pieces (e.g., Toilet system is $5.25 vs. $5.75). Can you confirm that's supposed to be that way?",""],["Is there a setup that doesn't require adding an aluminum side box but still takes up that space? They're $2.50 per box per day; with 5 rafts over 16 days, that's $200",""],["Want to make sure you got my wife's nursing license and that it's accounted for","They did"],["Dimensions of the captains boxes? Can we fit a blackstone in there?",""],["Is it listed somewhere what is included in first aid box?",""],["Do people jump in the water?",""],["What does the cargo cover look like? Which model?",""],["Quick Notes from Ceiba Chat:",""],["Can some people exit at Diamond Creek while others continue on to Pearce Ferry? Yes",""],["Truck & Trailer carries 4 people total: 1 driver + 3 passengers",""],["Truck & Trailer has to happen either way, and can carry 3 rafters + 1 person from Ceiba",""],["We're responsible for covering Ceiba driver & staff fees for Diamond Creek permits",""],["Just one driver for the Truck & Trailer + however many shuttlers are driving our vehicles",""],["Truck and trailer is $900 at Diamond, $930 at Pearce; Van is $900",""],["Flagstaff Liquors will deliver beer & sodas to Ceiba",""],["It was easy to find driftwood the entire way",""]]},{title:"Estimates (rate \u2192 trip total)",group:"Food",cols:["Item","Rate","Trip total"],rows:[["Est. lbs of Propane (X lbs per person per day)","0.2","26"],["Est. Bundles of Firewood (1 bundle per hour * X hours per night)","6","756"],["Est. gal of Water (X gal per person per day)","1","126"],["Est. Groover Deposit Boxes (users * days / X uses per deposit box)","45","3"],["Est. Wag Bags (1 in X people shit themselves every 5 days)","5","6"],[ It was easy to find driftwood the entire way`},{title:"June Crew Council Minutes",group:"Crew Council",text:`The Grand Canyon monthly meeting was a comprehensive planning session focused on trip logistics, group dynamics, safety, training, and communication for the upcoming winter river expedition. Brian Cain led the meeting, starting with a historical quote from John Wesley Powell to set the tone for adventure and uncertainty, but emphasized that the group would be well-prepared by the time of launch.

The group discussed the current roster, noting that while the permit allows for up to 16 people, not all are fully committed yet. Brian stressed the importance of team cohesion and being selective about adding new members, given the challenging nature of the trip. The group reviewed the Google Drive folder containing planning resources, including a master spreadsheet with river segments, campsites, rapids (rated on the Grand Canyon\u2019s unique 1-9 scale), and GPX files for navigation.

A major focus was the itinerary: the trip launches from Lee\u2019s Ferry on December 28, with a mandatory ranger check-in the day before. The group must average 17.6 miles per day to reach key milestones, particularly Cremation Camp near Phantom Ranch, where a crew swap and mule-supported gear transfer are planned. The limited daylight in late December (about 9 hours, with even less sun at the canyon bottom) was highlighted as a significant challenge, making efficiency and early starts critical. The group discussed the pace required, referencing past trips and the need to balance rowing speed with time for scouting rapids and camp setup.

Takeout options were debated: Phantom Ranch (with a strenuous 5,000-foot hike out), Diamond Creek, and Pierce Ferry. The consensus leaned toward taking out at Diamond Creek to allow for a layover day and a less rushed experience, rather than pushing through the less scenic, flat-water stretch to Pierce Ferry. The group valued having buffer days for side hikes (like Havasu), rest, and contingency in case of delays due to weather or mishaps.

Logistics for travel to and from the river were reviewed, including airport options (Flagstaff, Las Vegas, St. George), car rentals, and outfitter shuttles. The group discussed the need for efficient meal planning (possibly focusing on big dinners and simple breakfasts), gear redundancies (extra shoes, chairs, walkie-talkies), and the importance of a comprehensive gear list. There was also discussion about filming the trip, with questions about camera mounts and safety.

Training was emphasized as essential, with recommendations for cardio, core strength, and endurance to handle consecutive long rowing days and the strenuous hike out for those exiting at Phantom Ranch. Injury prevention and gradual buildup were stressed, and the group encouraged sharing training plans and using Strava for motivation. Swiftwater rescue courses and online safety resources were recommended.

For communication, the group agreed to transition from text to Telegram for better organization, with the possibility of using an AI chatbot for FAQs. A practice trip to Westwater Canyon was proposed for the fall as a tune-up, with a poll to be conducted for scheduling. The meeting concluded with reminders to crowdsource future agenda topics, excitement for the adventure, and a lighthearted discussion about team commitment and the possibility of applying for a documentary with TGR.`},{title:"July 20th Crew Council Minutes",group:"Crew Council",text:`The meeting discussed logistics for an upcoming Grand Canyon trip, focusing on reaching Phantom Ranch and deciding between Diamond Creek and Pierce Ferry for the final takeout. The group aims to leave Lee's Ferry on Sunday, with options to reach Phantom Ranch by Saturday or Sunday, averaging 14.7 miles per day. For the lower section, they considered reaching Diamond Creek on Wednesday, Friday, or Saturday, with potential side hikes to Havasu Canyon. The group debated the pros and cons of reaching Pierce Ferry, including the impact on travel plans and the need for additional resupply. A tentative plan was to reach Diamond Creek on Saturday and Pierce Ferry on Monday. The team discussed logistics for their Grand Canyon trip, confirming 11 participants and planning to use four boats with two to three people per boat. They debated whether to end at Phantom Ranch or Pierce Ferry, opting for Pierce Ferry on Sunday to allow for more side hikes and layover days. They also considered alternative rivers like the Snake due to low flows in Westwater Canyon. Brian Cain emphasized the importance of rowing practice and shared resources for navigating the rapids. Concerns about potential flash flooding due to a Super El Nino event were raised, but reassurances were given based on weather monitoring.
